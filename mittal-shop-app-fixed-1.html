<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Mittal Kiryana & Cosmetic Store</title>
<style>
:root{
  --ink:#1c2a22;
  --paper:#f7f5ef;
  --card:#ffffff;
  --leaf:#2f6b4f;
  --leaf-dark:#20503a;
  --turmeric:#e2a125;
  --turmeric-dark:#c0870f;
  --brick:#b6472f;
  --line:#e4e0d3;
  --muted:#6b7568;
  --radius:14px;
  --radius-sm:8px;
}
*{box-sizing:border-box;}
#splash{position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:repeating-conic-gradient(var(--leaf) 0deg 9deg, var(--leaf-dark) 9deg 18deg);transition:opacity .5s ease;padding:24px;text-align:center;}
#splash.hide{opacity:0;pointer-events:none;}
#splash .splash-name{color:#fff;font-weight:800;font-size:22px;letter-spacing:.4px;text-transform:uppercase;margin-bottom:28px;line-height:1.3;text-shadow:0 2px 6px rgba(0,0,0,.25);}
#splash .splash-logo-wrap{width:170px;height:170px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 34px rgba(0,0,0,.28);padding:10px;}
#splash .splash-logo-wrap img{width:100%;height:100%;object-fit:contain;border-radius:50%;}
#splash .splash-tag{color:rgba(255,255,255,.9);font-size:13px;margin-top:22px;letter-spacing:.3px;}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--paper);color:var(--ink);}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
.app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--paper);position:relative;padding-bottom:72px;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:var(--leaf);color:#fff;position:sticky;top:0;z-index:20;}
.topbar .brand{display:flex;align-items:center;gap:10px;}
.brand .mark{width:38px;height:38px;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;padding:3px;overflow:hidden;}
.brand .names div:first-child{font-weight:700;font-size:15px;line-height:1.15;}
.brand .names div:last-child{font-size:11px;opacity:.85;}
.mode-switch{display:flex;background:rgba(255,255,255,.15);border-radius:20px;padding:2px;}
.mode-switch button{border:none;background:transparent;color:#fff;font-size:11px;padding:6px 8px;border-radius:18px;opacity:.8;}
.mode-switch button.active{background:#fff;color:var(--leaf-dark);opacity:1;font-weight:600;}
.section{padding:16px;}
.h2{font-size:19px;font-weight:700;margin:0 0 4px;letter-spacing:-.2px;}
.sub{color:var(--muted);font-size:13px;margin:0 0 14px;}
.searchbar{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;}
.searchbar input{border:none;outline:none;background:transparent;flex:1;font-size:14px;}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 16px 4px;-webkit-overflow-scrolling:touch;}
.chips::-webkit-scrollbar{display:none;}
.chip{flex-shrink:0;padding:8px 14px;border-radius:20px;background:var(--card);border:1px solid var(--line);font-size:13px;white-space:nowrap;color:var(--ink);}
.chip.active{background:var(--leaf);color:#fff;border-color:var(--leaf);}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px 16px;}
.catgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:4px 16px 16px;}
.catcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:8px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;}
.catcard-img{width:100%;aspect-ratio:1/1;border-radius:10px;overflow:hidden;background:linear-gradient(135deg,#eef1e9,#e3ece1);display:flex;align-items:center;justify-content:center;font-size:28px;}
.catcard-img img{width:100%;height:100%;object-fit:cover;display:block;}
.catcard-name{font-size:12.5px;font-weight:700;line-height:1.2;}
.catcard-count{font-size:10px;color:var(--muted);}
.hamburger-btn{background:rgba(255,255,255,.15);border:none;color:#fff;font-size:19px;width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.drawer-bg{position:fixed;inset:0;background:rgba(20,25,20,.5);z-index:65;display:flex;}
.drawer-panel{width:78%;max-width:300px;height:100%;background:var(--leaf);color:#fff;overflow-y:auto;box-shadow:4px 0 20px rgba(0,0,0,.25);animation:drawerIn .22s ease;}
@keyframes drawerIn{from{transform:translateX(-100%);}to{transform:translateX(0);}}
.drawer-head{display:flex;align-items:center;gap:12px;padding:26px 18px 20px;border-bottom:1px solid rgba(255,255,255,.18);}
.drawer-avatar{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;}
.drawer-name{font-weight:700;font-size:14.5px;}
.drawer-phone{font-size:11.5px;opacity:.85;margin-top:2px;}
.drawer-menu{padding:8px 0;}
.drawer-item{width:100%;display:flex;align-items:center;gap:14px;background:none;border:none;color:#fff;padding:12px 18px;font-size:13.5px;text-align:left;}
.drawer-item:active{background:rgba(255,255,255,.12);}
.drawer-item .ic{font-size:17px;width:20px;text-align:center;}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;}
.pcard .img{height:96px;background:linear-gradient(135deg,#eef1e9,#e3ece1);display:flex;align-items:center;justify-content:center;font-size:34px;position:relative;}
.pcard .badge{position:absolute;top:6px;left:6px;background:var(--brick);color:#fff;font-size:10px;padding:2px 7px;border-radius:10px;font-weight:600;}
.pcard .body{padding:10px 10px 12px;display:flex;flex-direction:column;gap:4px;flex:1;}
.pcard .name{font-size:13px;font-weight:600;line-height:1.25;min-height:32px;}
.pcard .unit{font-size:11px;color:var(--muted);}
.pcard .price-row{display:flex;align-items:baseline;gap:6px;margin-top:2px;}
.pcard .price{font-weight:700;font-size:14px;}
.pcard .mrp{font-size:11px;color:var(--muted);text-decoration:line-through;}
.pcard .actions{display:flex;gap:6px;margin-top:8px;}
.btn{border:none;border-radius:10px;padding:8px 10px;font-size:12.5px;font-weight:600;text-align:center;}
.btn-leaf{background:var(--leaf);color:#fff;}
.btn-turm{background:var(--turmeric);color:#3a2a06;}
.btn-outline{background:#fff;border:1px solid var(--line);color:var(--ink);}
.btn-brick{background:var(--brick);color:#fff;}
.btn-block{width:100%;}
.btn-sm{padding:5px 9px;font-size:11.5px;}
.qty-stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;}
.qty-stepper button{background:none;border:none;padding:6px 10px;font-size:15px;}
.qty-stepper span{padding:0 8px;font-size:13px;min-width:20px;text-align:center;}
.stock-out{opacity:.55;}
.stock-tag{font-size:10px;color:var(--brick);font-weight:600;}
.offer-card{flex-shrink:0;width:230px;background:linear-gradient(135deg,var(--turmeric),#f0b93d);border-radius:14px;padding:12px;display:flex;gap:10px;align-items:center;}
.offer-marquee-wrap{overflow:hidden;padding:4px 0;}
.offer-marquee-track{display:flex;gap:12px;width:max-content;padding:0 16px;}
.offer-marquee-track.scrolling{animation:offerScroll 22s linear infinite;}
.offer-marquee-track.scrolling:active{animation-play-state:paused;}
@keyframes offerScroll{
  from{transform:translateX(0);}
  to{transform:translateX(calc(-50% - 6px));}
}
.offer-emoji{font-size:30px;flex-shrink:0;}
.offer-title{font-weight:800;font-size:13.5px;color:#3a2a06;}
.offer-desc{font-size:11px;color:#5a4310;margin-top:2px;}
.offer-badge{display:inline-block;margin-top:5px;background:#3a2a06;color:#fff;font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;}
.freebie-tag{display:inline-block;margin-top:4px;background:#e5f4ea;color:#1f7a44;font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:8px;}
.festival-banner{width:100%;background:linear-gradient(90deg,var(--brick),var(--turmeric),var(--brick));background-size:200% 100%;animation:fbmove 6s linear infinite;color:#fff;padding:14px 0;box-shadow:0 2px 8px rgba(0,0,0,.12);overflow:hidden;}
.fb-track{display:flex;width:max-content;gap:60px;padding:0 20px;animation:fbscroll 18s linear infinite;}
.fb-item{white-space:nowrap;font-weight:800;font-size:14px;display:flex;align-items:center;gap:8px;}
.fb-emoji{font-size:20px;flex-shrink:0;}
@keyframes fbscroll{from{transform:translateX(0);}to{transform:translateX(calc(-50% - 30px));}}
@keyframes fbmove{0%{background-position:0% 0;}100%{background-position:200% 0;}}
.wa-fab{position:fixed;right:16px;bottom:84px;width:52px;height:52px;border-radius:50%;background:#25D366;color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 6px 16px rgba(0,0,0,.2);z-index:30;border:none;max-width:520px;}
.bottomnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;background:#fff;border-top:1px solid var(--line);display:flex;z-index:25;}
.bottomnav button{flex:1;border:none;background:none;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:10.5px;}
.bottomnav button.active{color:var(--leaf);font-weight:700;}
.bottomnav .ic{font-size:19px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px;}
.row{display:flex;align-items:center;justify-content:space-between;}
.cart-item{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);}
.cart-item:last-child{border-bottom:none;}
.cart-item .thumb{width:52px;height:52px;border-radius:10px;background:#eef1e9;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;overflow:hidden;}
.cart-item .info{flex:1;min-width:0;}
.cart-item .info .n{font-size:13.5px;font-weight:600;}
.cart-item .info .p{font-size:12px;color:var(--muted);}
.summary-line{display:flex;justify-content:space-between;font-size:13.5px;padding:4px 0;color:var(--muted);}
.summary-line.total{color:var(--ink);font-weight:700;font-size:16px;border-top:1px dashed var(--line);margin-top:6px;padding-top:10px;}
label.field{display:block;font-size:12.5px;font-weight:600;margin-bottom:5px;color:var(--ink);}
.input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:13.5px;background:#fff;margin-bottom:12px;}
textarea.input{resize:vertical;min-height:60px;}
.pay-option{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;display:flex;align-items:center;gap:10px;}
.pay-option.selected{border-color:var(--leaf);background:#f2f8f4;}
.status-pill{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:20px;display:inline-block;}
.status-New{background:#eef1e9;color:#556;}
.status-Confirmed{background:#e8f0fb;color:#2454a3;}
.status-Preparing{background:#fdf1de;color:#a3661f;}
.status-Out{background:#fdeee0;color:#b25b16;}
.status-Delivered{background:#e5f4ea;color:#1f7a44;}
.status-Cancelled{background:#fbe7e4;color:#b6472f;}
.empty{text-align:center;padding:50px 20px;color:var(--muted);}
.empty .ic{font-size:38px;margin-bottom:10px;}
.modal-bg{position:fixed;inset:0;background:rgba(20,25,20,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center;}
.modal{background:#fff;width:100%;max-width:520px;border-radius:18px 18px 0 0;max-height:88vh;overflow-y:auto;padding:18px 16px 24px;}
.modal.center{border-radius:16px;margin:16px;align-self:center;max-height:80vh;}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.modal-head h3{margin:0;font-size:16px;}
.xbtn{background:var(--paper);border:none;width:28px;height:28px;border-radius:50%;font-size:15px;}
.tabbar{display:flex;gap:6px;overflow-x:auto;padding:0 16px 12px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:56px;z-index:15;}
.tabbar button{flex-shrink:0;border:none;background:none;padding:8px 10px;font-size:12px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;}
.tabbar button.active{color:var(--leaf-dark);border-color:var(--leaf);}
.admin-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px 14px;background:var(--card);border-bottom:1px solid var(--line);}
.admin-grid button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:10px 2px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:10.5px;color:var(--ink);font-weight:600;line-height:1.15;min-height:62px;}
.admin-grid button .ic{font-size:19px;}
.admin-grid button.active{background:var(--leaf);color:#fff;border-color:var(--leaf);}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px 16px;}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;}
.stat .v{font-size:20px;font-weight:800;}
.stat .l{font-size:11px;color:var(--muted);margin-top:2px;}
.admin-login{padding:60px 24px;}
.list-row{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid var(--line);gap:10px;}
.list-row:last-child{border-bottom:none;}
.tiny{font-size:11px;color:var(--muted);}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:10px;}
.pwwrap{position:relative;}
.pwwrap input{padding-right:42px;}
.pweye{position:absolute;right:6px;top:6px;background:none;border:none;font-size:17px;padding:6px;}
.link{color:var(--leaf-dark);font-weight:600;text-decoration:underline;background:none;border:none;font-size:inherit;padding:0;}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;z-index:60;max-width:80%;text-align:center;}
.imgrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
.imgpick{width:50px;height:50px;border-radius:10px;background:#eef1e9;display:flex;align-items:center;justify-content:center;font-size:20px;border:1px solid var(--line);position:relative;}
.imgpick .pic-inner{width:100%;height:100%;border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center;}
.imgpick .rm{position:absolute;top:-6px;right:-6px;background:var(--brick);color:#fff;width:18px;height:18px;border-radius:50%;font-size:11px;display:flex;align-items:center;justify-content:center;border:2px solid #fff;z-index:2;}
.emoji-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;max-height:160px;overflow-y:auto;margin-bottom:6px;}
.emoji-grid button{background:var(--paper);border:1px solid var(--line);border-radius:8px;font-size:18px;padding:6px 0;}
table.inv{width:100%;border-collapse:collapse;font-size:12px;margin:10px 0;}
table.inv th,table.inv td{border:1px solid var(--line);padding:6px 8px;text-align:left;}
.invoice-box{background:transparent;padding:0;}
.inv2{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 4px 18px rgba(31,42,34,.1);border:1px solid var(--line);}
.inv2-head{background:linear-gradient(135deg,var(--leaf),var(--leaf-dark));color:#fff;padding:22px 20px 18px;text-align:center;position:relative;}
.inv2-head .logo{width:46px;height:46px;border-radius:12px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:24px;margin:0 auto 8px;}
.inv2-head .shopname{font-weight:800;font-size:17px;}
.inv2-head .shopmeta{font-size:11px;opacity:.9;margin-top:3px;}
.inv2-status{position:absolute;top:14px;right:14px;font-size:10px;font-weight:700;padding:4px 10px;border-radius:20px;background:rgba(255,255,255,.22);}
.inv2-body{padding:18px 18px 20px;}
.inv2-title{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px;}
.inv2-title .big{font-size:18px;font-weight:800;letter-spacing:.5px;color:var(--leaf-dark);}
.inv2-meta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;padding-bottom:14px;border-bottom:1px dashed var(--line);}
.inv2-meta .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:2px;}
.inv2-meta .val{font-size:13px;font-weight:600;}
.inv2-table{width:100%;border-collapse:collapse;font-size:12.5px;margin-bottom:14px;}
.inv2-table th{background:var(--paper);text-align:left;padding:8px;font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);}
.inv2-table td{padding:9px 8px;border-bottom:1px solid var(--line);}
.inv2-table tr:last-child td{border-bottom:none;}
.inv2-totals{margin-left:auto;width:72%;}
.inv2-totals .line{display:flex;justify-content:space-between;font-size:12.5px;padding:4px 0;color:var(--muted);}
.inv2-totals .grand{display:flex;justify-content:space-between;font-size:16px;font-weight:800;color:var(--ink);background:var(--paper);border-radius:10px;padding:10px 12px;margin-top:8px;}
.inv2-footer{text-align:center;margin-top:18px;padding-top:14px;border-top:1px dashed var(--line);font-size:11.5px;color:var(--muted);}
@media print{.inv2{box-shadow:none;}}
@media print{.no-print{display:none!important;} .app{max-width:100%;padding-bottom:0;} .invoice-box{border:none;}}
</style>
</head>
<body>
<div id="splash">
  <div class="splash-name">Mittal Kiryana &<br>Cosmetic Shop</div>
  <div class="splash-logo-wrap"><img id="splashLogo" alt="logo"></div>
  <div class="splash-tag">Daily Needs • Better Life</div>
</div>
<div id="root" class="app"></div>
<script>
window.onerror = function(msg, src, line, col, err){
  // Generic "Script error." with no line/col info comes from cross-origin/injected
  // scripts (browser extensions, OS overlays) — not from our own code. Ignore those.
  if(msg === 'Script error.' && !line && !col) return;
  document.getElementById('root').innerHTML =
    '<div style="padding:30px;font-family:monospace;font-size:13px;white-space:pre-wrap;color:#b6472f;">'+
    '⚠️ App error:\n' + msg + '\nLine: ' + line + ':' + col + '\n\n' + (err && err.stack ? err.stack : '') +
    '</div>';
};
window.onunhandledrejection = function(event){
  const reason = event.reason;
  if(!reason) return;
  alert('⚠️ Error: ' + (reason.message ? reason.message : reason) + (reason.stack ? '\n\n'+reason.stack : ''));
};
</script>

const CORE_BIN = "6a9d2567f5f4af5e29709661";
const ACTIVITY_BIN = "6a9e8ed0ac6210605aaf2ca2";
const BIN_URLS = {
  core: "https://api.jsonbin.io/v3/b/" + CORE_BIN,
  activity: "https://api.jsonbin.io/v3/b/" + ACTIVITY_BIN
};
const ACTIVITY_KEYS = ["orders","stockHistory","reviews","ledger","dealerTx","custLedgerTx","memoCounter"];
function binForKey(key){ return ACTIVITY_KEYS.includes(key) ? "activity" : "core"; }

// All shared shop data (settings, products, orders, etc.) lives in these bins,
// so every customer's phone and the admin panel see the SAME data. We keep a
// local copy per bin (sharedCache) and re-fetch whenever the person switches
// screens, so it stays reasonably fresh without hammering the free request
// quota with constant background polling.
let sharedCache = { core: null, activity: null };

async function fetchSharedBin(which){
  const res = await fetch(BIN_URLS[which] + "/latest", { headers: { "X-Access-Key": JSONBIN_KEY } });
  if(!res.ok){
    const txt = await res.text().catch(()=>'');
    throw new Error('Load failed ('+which+', HTTP '+res.status+') '+txt.slice(0,150));
  }
  const data = await res.json();
  sharedCache[which] = data.record || {};
  return sharedCache[which];
}
async function pushSharedBin(which){
  const res = await fetch(BIN_URLS[which], {
    method: "PUT",
    headers: { "Content-Type": "application/json", "X-Access-Key": JSONBIN_KEY },
    body: JSON.stringify(sharedCache[which])
  });
  if(!res.ok){
    const txt = await res.text().catch(()=>'');
    throw new Error('Save failed ('+which+', HTTP '+res.status+') '+txt.slice(0,150));
  }
}
const SHARED_KEYS = ["settings","categories","products","orders","stockHistory","customInfo","customers","invoiceCounter","offers","reviews","ledger","memoCounter","dealers","dealerTx","custLedgerAccounts","custLedgerTx","coupons"];

// ---------- storage helpers ----------
async function sGet(key, fallback){
  const which = binForKey(key);
  try{
    if(!sharedCache[which]) await fetchSharedBin(which);
  }catch(e){
    console.error("Could not reach JSONBin", e);
    showToast('⚠️ Cloud load error: '+e.message);
    if(!sharedCache[which]) sharedCache[which] = {};
  }
  return (sharedCache[which] && sharedCache[which][key] !== undefined) ? sharedCache[which][key] : fallback;
}
let persistentSaveError = null; // survives even if alert() gets swallowed while the tab was backgrounded

async function sSet(key, val){
  const which = binForKey(key);
  try{
    await fetchSharedBin(which); // always pull the latest first, so we don't overwrite other browsers' changes
    sharedCache[which][key] = val;
    await pushSharedBin(which);
    // VERIFY: re-fetch from the server and confirm what we sent actually stuck.
    // Free-tier size limits can cause a write to be accepted (200 OK) but not
    // actually persisted correctly — this catches that instead of trusting res.ok blindly.
    const before = JSON.stringify(val);
    await fetchSharedBin(which);
    const after = JSON.stringify(sharedCache[which][key]);
    if(before !== after){
      throw new Error('Save appeared to succeed but data did not persist on the server — likely the free storage size limit (100KB) was exceeded for this data (photos take up a lot of space). Try removing the photo, or removing photos from a few older products, then try again.');
    }
    persistentSaveError = null;
    return true; // saved to cloud AND verified
  }catch(e){
    console.error("Could not save to JSONBin", e);
    if(!sharedCache[which]) sharedCache[which] = {};
    sharedCache[which][key] = val; // keep it locally at least, so this session still works
    persistentSaveError = '⚠️ Cloud save FAILED — this change was NOT saved online and will disappear.\n\nReason: '+e.message;
    alert(persistentSaveError);
    render();
    return false; // cloud save failed — caller should not claim success
  }
}
async function refreshShared(){
  try{
    await Promise.all(["core","activity"].map(fetchSharedBin));
    SHARED_KEYS.forEach(k=>{
      const which = binForKey(k);
      if(sharedCache[which] && sharedCache[which][k] !== undefined) state[k] = sharedCache[which][k];
    });
  }catch(e){
    console.error("Could not refresh from JSONBin", e);
    showToast('⚠️ Could not refresh: '+e.message);
  }
  render();
}
// Personal data (cart, login session) stays on this device only — plain localStorage.
async function pGet(key, fallback){
  try{ const v = localStorage.getItem('mks_'+key); return v!=null ? JSON.parse(v) : fallback; }
  catch(e){ return fallback; }
}
async function pSet(key, val){
  try{ localStorage.setItem('mks_'+key, JSON.stringify(val)); }
  catch(e){ console.error('localStorage write failed for '+key, e); }
}

function imgOrEmoji(img){
  if(img && (img.startsWith('data:') || img.startsWith('http'))) return `<img src="${img}" style="width:100%;height:100%;object-fit:cover;display:block;">`;
  return img || '🛒';
}
function fileToResizedDataUrl(file, maxDim, quality){
  maxDim = maxDim || 220; quality = quality || 0.45;
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = reject;
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > h){ if(w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; } }
        else { if(h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; } }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

// Uploads a photo to ImgBB (free image host) and returns a short URL instead of
// a big base64 string, so JSONBin's 100KB-per-record free-plan limit is never hit.
async function uploadToImgbb(dataUrl){
  const base64 = dataUrl.split(',')[1]; // strip the "data:image/jpeg;base64," prefix
  const body = new URLSearchParams();
  body.set('key', IMGBB_KEY);
  body.set('image', base64);
  const res = await fetch('https://api.imgbb.com/1/upload', { method: 'POST', body });
  const json = await res.json().catch(()=>null);
  if(!res.ok || !json || !json.success){
    const msg = (json && json.error && json.error.message) || ('HTTP '+res.status);
    throw new Error('Image upload failed: '+msg);
  }
  return json.data.url || json.data.display_url;
}

function catName(id){ const c = state.categories.find(c=>c.id===id); return c?c.name:"Other"; }
function productById(id){ return state.products.find(p=>p.id===id); }
function productReviews(productId){ return state.reviews.filter(r=>r.productId===productId).sort((a,b)=>b.date_ts-a.date_ts); }
function productRating(productId){
  const list = productReviews(productId);
  if(!list.length) return {avg:0, count:0};
  const avg = list.reduce((s,r)=>s+r.rating,0) / list.length;
  return {avg, count: list.length};
}
function starsHTML(avg, size){
  size = size || 13;
  let out = '';
  for(let i=1;i<=5;i++){ out += `<span style="font-size:${size}px;color:${i<=Math.round(avg)?'#e2a125':'#ddd8c8'};">★</span>`; }
  return out;
}
function inDateRange(ts, range){
  const d = new Date(ts);
  const now = new Date();
  if(range==='today') return d.toDateString()===now.toDateString();
  if(range==='yesterday'){ const y=new Date(now); y.setDate(y.getDate()-1); return d.toDateString()===y.toDateString(); }
  if(range==='week'){ const w=new Date(now); w.setDate(w.getDate()-7); return d>=w; }
  if(range==='month'){ const m=new Date(now); m.setDate(1); m.setHours(0,0,0,0); return d>=m; }
  return true;
}

function cartTotal(){ return state.cart.reduce((s,i)=>{ const p=productById(i.productId); return p? s+p.sellingPrice*i.qty : s; },0); }
function getAppliedCoupon(){ return state.appliedCoupon ? state.coupons.find(c=>c.id===state.appliedCoupon) : null; }
function couponDiscountAmount(coupon, subtotal){
  if(!coupon || !coupon.active) return 0;
  if(subtotal < (coupon.minOrder||0)) return 0;
  let disc = coupon.type==='percent' ? subtotal*(coupon.value||0)/100 : (coupon.value||0);
  if(coupon.maxDiscount) disc = Math.min(disc, coupon.maxDiscount);
  return Math.max(0, Math.min(disc, subtotal));
}

// ---------- stock ----------
async function adjustStock(productId, delta, reason){
  const p = productById(productId); if(!p) return;
  const prev = p.availableQty;
  p.availableQty = Math.max(0, prev + delta);
  state.stockHistory.unshift({id:uid('sh_'), productId, productName:p.name, prev, added: delta>0?delta:0, removed: delta<0?-delta:0, newStock:p.availableQty, date: nowStr(), reason});
  await sSet('products', state.products);
  await sSet('stockHistory', state.stockHistory);
}

    root.innerHTML = `<div class="section" style="padding-top:60px;text-align:center;">
      <div style="font-size:38px;">⏳</div>
      <div class="h2">Loading shop data...</div>
      <div class="sub">${state.toast ? escapeHtml(state.toast) : 'Connecting to the cloud store'}</div>
    </div>`;
    return;
  }
  root.innerHTML = topbarHTML() + (persistentSaveError ? `<div class="section" style="background:#fdecea;border:1px solid #f2b8b5;border-radius:10px;margin:10px 16px 0;padding:10px 12px;color:#8a1c14;font-size:12.5px;white-space:pre-wrap;">${escapeHtml(persistentSaveError)}<div style="margin-top:6px;"><button class="btn btn-sm btn-outline" data-act="dismisssaveerror">Dismiss</button></div></div>` : '') + (state.mode==='shop' ? shopHTML() : adminHTML()) + drawerHTML() + (state.toast? `<div class="toast">${escapeHtml(state.toast)}</div>` : "");
  attachEvents();
  const dp = root.querySelector('.drawer-panel');
  if(dp) dp.addEventListener('click', e=>e.stopPropagation());
  if(state.mode==='admin' && state.adminLoggedIn && state.adminTab==='settings' && state.settings.siteUrl){
    loadQRLib().then(()=>{
      const el = document.getElementById('shopQr');
      if(el && window.QRCode){ el.innerHTML=''; new QRCode(el, {text: state.settings.siteUrl, width:150, height:150}); }
    });
  }
}

function productCard(p){
  const cat = catName(p.category);
  const out = p.availableQty<=0;
  const disc = p.mrp>p.sellingPrice ? Math.round((1-p.sellingPrice/p.mrp)*100) : 0;
  const rating = productRating(p.id);
  return `<div class="pcard ${out?'stock-out':''}">
    <div class="img" data-act="viewproduct" data-id="${p.id}">${disc>0?`<div class="badge">${disc}% OFF</div>`:''}${imgOrEmoji(p.images && p.images[0])}</div>
    <div class="body">
      <div class="name" data-act="viewproduct" data-id="${p.id}">${escapeHtml(p.name)}</div>
      <div class="unit">${escapeHtml(cat)} • ${escapeHtml(p.unit)}</div>
      ${rating.count? `<div style="margin-top:2px;">${starsHTML(rating.avg,11)} <span class="tiny">(${rating.count})</span></div>` : ''}
      <div class="price-row"><span class="price">${money(p.sellingPrice)}</span>${p.mrp>p.sellingPrice?`<span class="mrp">${money(p.mrp)}</span>`:''}</div>
      ${p.freebie? `<div class="freebie-tag">🎁 ${escapeHtml(p.freebie)}</div>` : ''}
      ${out?`<span class="stock-tag">${t('outOfStock')}</span>`:''}
      <div class="actions">

        <button class="btn btn-outline btn-sm" style="flex:1" data-act="addcart" data-id="${p.id}">${t('add')}</button>

function orderStatusSteps(o){
  const steps = ["New","Confirmed","Preparing","Out","Delivered"];
  const labels = {New:"New Order",Confirmed:"Confirmed",Preparing:"Preparing",Out:"Out for Delivery",Delivered:"Delivered"};
  if(o.status==='Cancelled') return `<span class="status-pill status-Cancelled">Cancelled</span>`;
  return steps.map(s=>`<span class="status-pill status-${s}" style="opacity:${steps.indexOf(s)<=steps.indexOf(o.status)?1:.35}">${labels[s]}</span>`).join(' → ');
}

function orderCardHTML(o, isAdmin){
  const canCancel = !isAdmin && !['Delivered','Cancelled'].includes(o.status) && !o.cancelRequested;
  return `<div class="card">
    <div class="row">
      <div><b>#${o.invoiceNo||o.id.slice(-5)}</b><div class="tiny">${o.createdAtStr}</div></div>
      ${isAdmin?`<span class="status-pill status-${o.status}">${o.status}</span>`:''}
    </div>
    <div style="margin:8px 0;">${orderStatusSteps(o)}</div>
    <div class="tiny">${o.items.length} item(s) • ${money(o.grandTotal)} • ${o.paymentMethod}</div>
    ${isAdmin? `<div class="tiny">${escapeHtml(o.customerName)} • ${escapeHtml(o.mobile)}<br>${escapeHtml(o.address)}</div>`:''}
    ${o.cancelRequested? `<div class="tiny" style="color:var(--brick);margin-top:6px;">Cancellation requested by customer${o.cancelReason?': '+escapeHtml(o.cancelReason):''}</div>`:''}
    <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;">
      <button class="btn btn-outline btn-sm" data-act="vieworder" data-id="${o.id}">${t('viewDetails')}</button>
      ${canCancel? `<button class="btn btn-outline btn-sm" data-act="reqcancel" data-id="${o.id}">${t('requestCancellation')}</button>`:''}
      ${isAdmin? adminOrderActions(o):''}
    </div>
  </div>`;
}
function adminOrderActions(o){
  const steps = ["New","Confirmed","Preparing","Out","Delivered"];
  const idx = steps.indexOf(o.status);
  let html = "";
  if(o.status!=='Cancelled' && idx<steps.length-1){
    html += `<button class="btn btn-leaf btn-sm" data-act="advance" data-id="${o.id}">Move to ${({New:"Confirmed",Confirmed:"Preparing",Preparing:"Out for Delivery",Out:"Delivered"})[o.status]}</button>`;
  }
  if(o.cancelRequested){
    html += `<button class="btn btn-brick btn-sm" data-act="approvecancel" data-id="${o.id}">Approve Cancel</button>`;
    html += `<button class="btn btn-outline btn-sm" data-act="rejectcancel" data-id="${o.id}">Reject</button>`;
  } else if(o.status!=='Delivered' && o.status!=='Cancelled'){
    html += `<button class="btn btn-outline btn-sm" data-act="admincancel" data-id="${o.id}">Cancel Order</button>`;
  }
  html += `<button class="btn btn-turm btn-sm" data-act="genbill" data-id="${o.id}">Invoice</button>`;
  if(o.status==='Cancelled'){
    html += `<button class="btn btn-brick btn-sm" data-act="delorder" data-id="${o.id}">Delete Order</button>`;
  }
  return html;
}

function adminDashboardHTML(){

  const todaySales = orders.filter(o=>o.status!=='Cancelled'&&isToday(o)).reduce((s,o)=>s+o.grandTotal,0);
  const lowStock = state.products.filter(p=>p.availableQty>0 && p.availableQty<=5).length;
  const outStock = state.products.filter(p=>p.availableQty<=0).length;
  const todayLedger = state.ledger.filter(e=>inDateRange(e.date_ts,'today'));
  const todayCashSales = todayLedger.filter(e=>e.type==='sale').reduce((s,e)=>s+e.amount,0);
  const todayPurchases = todayLedger.filter(e=>e.type==='purchase').reduce((s,e)=>s+e.amount,0);
  const todayProfit = (todaySales+todayCashSales) - todayPurchases;
  const totalPayable = state.dealers.reduce((s,dl)=>s+Math.max(0,dealerBalance(dl.id)),0);
  const totalReceivable = state.custLedgerAccounts.reduce((s,c)=>s+Math.max(0,custBalance(c.id)),0);
  const stats = [

    ["Today's Orders", orders.filter(isToday).length],
    ["Pending Orders", orders.filter(o=>!['Delivered','Cancelled'].includes(o.status)).length],

    ["Cancelled Orders", orders.filter(o=>o.status==='Cancelled').length],

    ["Today's Sales", money(todaySales)],

        <div><div style="font-size:17px;font-weight:800;">${money(todayPurchases)}</div><div class="tiny" style="color:rgba(255,255,255,.8);">Purchase</div></div>

function buildSummaryText(){
  const orders = state.orders;
  const totalSales = orders.filter(o=>o.status!=='Cancelled').reduce((s,o)=>s+o.grandTotal,0);
  const totalPurchaseLedger = state.ledger.filter(e=>e.type==='purchase').reduce((s,e)=>s+e.amount,0);
  const totalCashSales = state.ledger.filter(e=>e.type==='sale').reduce((s,e)=>s+e.amount,0);
  const totalDealerPayable = state.dealers.reduce((s,d)=>s+Math.max(0,dealerBalance(d.id)),0);
  const totalCustReceivable = state.custLedgerAccounts.reduce((s,c)=>s+Math.max(0,custBalance(c.id)),0);
  const profit = (totalSales+totalCashSales) - totalPurchaseLedger;
  let txt = `${state.settings.shopName} — Hisaab Summary\nDate: ${nowStr()}\n\n`;
  txt += `Total Sale: ${money(totalSales+totalCashSales)}\nTotal Purchase: ${money(totalPurchaseLedger)}\nProfit: ${money(profit)}\n\n`;
  txt += `Dealer Payable (aapko dena hai): ${money(totalDealerPayable)}\n`;
  state.dealers.forEach(d=>{ const b=dealerBalance(d.id); if(b>0) txt += `  - ${d.name}: ${money(b)}\n`; });
  txt += `\nCustomer Receivable (aapko milna hai): ${money(totalCustReceivable)}\n`;
  state.custLedgerAccounts.forEach(c=>{ const b=custBalance(c.id); if(b>0) txt += `  - ${c.name}: ${money(b)}\n`; });
  return txt;
}

function adminReportsHTML(){
  const range = state.reportRange || 'today';
  const now = new Date();
  function inRange(o){
    const d = new Date(o.createdAt);
    if(range==='today') return d.toDateString()===now.toDateString();
    if(range==='yesterday'){ const y=new Date(now); y.setDate(y.getDate()-1); return d.toDateString()===y.toDateString(); }
    if(range==='week'){ const w=new Date(now); w.setDate(w.getDate()-7); return d>=w; }
    if(range==='month'){ const m=new Date(now); m.setDate(m.getDate()-30); return d>=m; }
    return true;
  }
  const set = state.orders.filter(inRange);
  const sales = set.filter(o=>o.status!=='Cancelled').reduce((s,o)=>s+o.grandTotal,0);
  const delivered = set.filter(o=>o.status==='Delivered').length;
  const cancelled = set.filter(o=>o.status==='Cancelled').length;
  const pending = set.filter(o=>!['Delivered','Cancelled'].includes(o.status)).length;
  const prodAgg = {};
  set.forEach(o=>{ if(o.status==='Cancelled') return; o.items.forEach(it=>{ prodAgg[it.name]=(prodAgg[it.name]||0)+it.qty; }); });
  const best = Object.entries(prodAgg).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const catAgg = {};
  set.forEach(o=>{ if(o.status==='Cancelled') return; o.items.forEach(it=>{ const p=productById(it.productId); const cn = p?catName(p.category):'Other'; catAgg[cn]=(catAgg[cn]||0)+it.qty*it.price; }); });

  return `<div class="section">
    <div class="h2">Sales Report</div>
    <div class="chips" style="padding-left:0;">
      ${[['today','Today'],['yesterday','Yesterday'],['week','This Week'],['month','This Month'],['all','All Time']].map(([k,l])=>`<button class="chip ${range===k?'active':''}" data-act="setreport" data-r="${k}">${l}</button>`).join('')}
    </div>
  </div>
  <div class="stat-grid">
    <div class="stat"><div class="v">${money(sales)}</div><div class="l">Total Sales</div></div>
    <div class="stat"><div class="v">${set.length}</div><div class="l">Orders</div></div>
    <div class="stat"><div class="v">${delivered}</div><div class="l">Delivered</div></div>
    <div class="stat"><div class="v">${pending}</div><div class="l">Pending</div></div>
    <div class="stat"><div class="v">${cancelled}</div><div class="l">Cancelled</div></div>
  </div>
  <div class="section">
    <div class="card"><b>Best-selling products</b>${best.length?best.map(([n,q])=>`<div class="list-row"><div>${escapeHtml(n)}</div><div class="tiny">${q} sold</div></div>`).join(''):`<div class="tiny">No sales in this range.</div>`}</div>
    <div class="card"><b>Revenue by category</b>${Object.keys(catAgg).length?Object.entries(catAgg).map(([n,v])=>`<div class="list-row"><div>${escapeHtml(n)}</div><div class="tiny">${money(v)}</div></div>`).join(''):`<div class="tiny">No sales in this range.</div>`}</div>
    <button class="btn btn-outline btn-block" data-act="exportreport">Export report (CSV)</button>
  </div>`;
}

// ---------- modal system ----------
let modalHTML = null;
function openModal(html, center){ modalHTML = html; renderModal(center); }
function closeModal(){ modalHTML = null; const el=document.getElementById('modalRoot'); if(el) el.remove(); }
function renderModal(center){
  let el = document.getElementById('modalRoot');
  if(!el){ el = document.createElement('div'); el.id='modalRoot'; document.body.appendChild(el); }
  el.innerHTML = `<div class="modal-bg" data-act="closemodal">
    <div class="modal ${center?'center':''}" data-stop="1">${modalHTML}</div>
  </div>`;
  el.querySelector('.modal').addEventListener('click', e=>e.stopPropagation());
  el.querySelector('.modal-bg').addEventListener('click', ()=>closeModal());
  attachEvents(el);
}

// ---------- event wiring ----------
function attachEvents(scope){
  const root = scope || document;
  root.querySelectorAll('[data-act]').forEach(el=>{
    el.onclick = (e)=> handleAction(el.dataset, el);
  });
  const si = root.querySelector('#searchInput');
  if(si){ si.oninput = (e)=>{ state.searchQuery = e.target.value; render(); document.getElementById('searchInput').focus(); document.getElementById('searchInput').setSelectionRange(state.searchQuery.length,state.searchQuery.length); }; }
}

async function handleAction(d, el){
  switch(d.act){
    case 'togglepw': {
      const inp = document.getElementById(d.target);
      if(inp){ inp.type = inp.type === 'password' ? 'text' : 'password'; el.textContent = inp.type === 'password' ? '👁️' : '🙈'; }
      break;
    }
    case 'togglelang': state.lang = state.lang==='hi' ? 'en' : 'hi'; pSet('lang', state.lang); render(); break;
    case 'refreshnow': showToast('Refreshing...'); await refreshShared(); showToast('Updated'); break;
    case 'mode-shop': state.mode='shop'; render(); refreshShared(); break;
    case 'mode-admin': state.mode='admin'; render(); refreshShared(); break;
    case 'shoptab': state.shopTab=d.tab; render(); refreshShared(); break;
    case 'admintab': state.adminTab=d.tab; render(); refreshShared(); break;
    case 'setcat': state.activeCat=d.cat; render(); break;
    case 'catnav': state.activeCat=d.cat; state.shopTab='home'; render(); break;
    case 'addcart': await addToCart(d.id,1); showToast('Added to cart'); break;
    case 'buynow': await addToCart(d.id,1); state.shopTab='cart'; render(); break;
    case 'cartplus': await addToCart(d.id,1); break;
    case 'cartminus': await addToCart(d.id,-1); break;
    case 'cartremove': state.cart = state.cart.filter(i=>i.productId!==d.id); await pSet('cart', state.cart); render(); break;
    case 'applypromo': {
      const inp = document.getElementById('promoInput');
      const val = inp ? inp.value.trim() : '';
      if(!val){ showToast('Please enter a promo code'); break; }
      const found = state.coupons.find(c=>c.active && c.code.toLowerCase()===val.toLowerCase());
      if(!found){ showToast('Invalid or inactive promo code'); break; }
      if(cartTotal() < (found.minOrder||0)){ showToast('Minimum order '+money(found.minOrder)+' required for this code'); break; }
      state.appliedCoupon = found.id;
      render();
      showToast('Promo code applied!');
      break;
    }
    case 'removepromo': state.appliedCoupon = null; render(); break;
    case 'copycoupon': navigator.clipboard?.writeText(d.code).then(()=>showToast('Code copied: '+d.code)); break;
    case 'toggledrawer': state.drawerOpen = !state.drawerOpen; render(); break;
    case 'closedrawer': state.drawerOpen = false; render(); break;
    case 'drawernav': state.shopTab = d.tab; state.drawerOpen = false; render(); refreshShared(); break;
    case 'drawerwa': state.drawerOpen = false; render(); window.open(waLink(state.settings.whatsapp, `Hi ${state.settings.shopName}, I need help.`),'_blank'); break;
    case 'drawerlogout': state.drawerOpen = false; await doLogout(); break;
    case 'newcoupon': openCouponForm(null); break;
    case 'editcoupon': openCouponForm(d.id); break;
    case 'delcoupon': if(confirm('Delete this coupon?')){ if(state.appliedCoupon===d.id) state.appliedCoupon=null; state.coupons = state.coupons.filter(c=>c.id!==d.id); await sSet('coupons', state.coupons); render(); } break;
    case 'togglecouponactive': { const c=state.coupons.find(c=>c.id===d.id); c.active=!c.active; await sSet('coupons', state.coupons); render(); break; }
    case 'viewproduct': openProductDetail(d.id); break;
    case 'checkout': if(!currentCustomer()){ state.shopTab='profile'; state.authMode='login'; render(); showToast('Please login or create an account to checkout'); } else openCheckout(); break;
    case 'saveprofile': await saveProfile(); break;
    case 'addaddress': addAddressPrompt(); break;
    case 'deladdress': { const cu=currentCustomer(); if(cu){ cu.addresses.splice(Number(d.i),1); await sSet('customers', state.customers); render(); } break; }
    case 'authmode': state.authMode = d.m; render(); break;
    case 'doregister': await doRegister(); break;
    case 'dologin': await doLogin(); break;
    case 'logout': await doLogout(); break;
    case 'closemodal': closeModal(); break;
    case 'dismisssaveerror': persistentSaveError = null; render(); break;
    case 'reqcancel': openCancelRequest(d.id); break;
    case 'vieworder': openOrderDetail(d.id); break;
    case 'adminlogin': doAdminLogin(); break;
    case 'adminlogout': state.adminLoggedIn=false; pSet('adminSession', false); render(); break;
    case 'newproduct': openProductForm(null); break;
    case 'editproduct': openProductForm(d.id); break;
    case 'delproduct': if(confirm('Delete this product?')){ state.products = state.products.filter(p=>p.id!==d.id); await sSet('products', state.products); render(); } break;
    case 'toggleactive': { const p=productById(d.id); p.active=!p.active; await sSet('products', state.products); render(); break; }
    case 'togglefeatured': { const p=productById(d.id); p.featured=!p.featured; await sSet('products', state.products); render(); break; }
    case 'newcategory': openCategoryForm(null); break;
    case 'newoffer': openOfferForm(null); break;
    case 'editoffer': openOfferForm(d.id); break;
    case 'deloffer': if(confirm('Delete this offer?')){ state.offers = state.offers.filter(o=>o.id!==d.id); await sSet('offers', state.offers); render(); } break;
    case 'toggleofferactive': { const o=state.offers.find(o=>o.id===d.id); o.active=!o.active; await sSet('offers', state.offers); render(); break; }
    case 'newcashsale': openLedgerForm('sale'); break;
    case 'newpurchase': openLedgerForm('purchase'); break;
    case 'setledger': state.ledgerRange = d.r; render(); break;
    case 'viewmemo': openCashMemo(d.id); break;
    case 'delledger': if(confirm('Delete this entry?')){ state.ledger = state.ledger.filter(e=>e.id!==d.id); await sSet('ledger', state.ledger); render(); } break;
    case 'newdealer': openDealerForm(null); break;
    case 'editdealer': openDealerForm(d.id); break;
    case 'deldealer': if(confirm('Delete this dealer and all their transaction history?')){ state.dealers = state.dealers.filter(x=>x.id!==d.id); state.dealerTx = state.dealerTx.filter(x=>x.dealerId!==d.id); await sSet('dealers', state.dealers); await sSet('dealerTx', state.dealerTx); render(); } break;
    case 'viewdealer': openDealerDetail(d.id); break;
    case 'newdealertx': openDealerTxForm(d.id, d.type); break;
    case 'deldealertx': if(confirm('Delete this transaction?')){ state.dealerTx = state.dealerTx.filter(x=>x.id!==d.id); await sSet('dealerTx', state.dealerTx); openDealerDetail(d.dealer); } break;
    case 'newcust': openCustForm(null); break;
    case 'editcust': openCustForm(d.id); break;
    case 'delcust': if(confirm('Delete this customer and all their transaction history?')){ state.custLedgerAccounts = state.custLedgerAccounts.filter(x=>x.id!==d.id); state.custLedgerTx = state.custLedgerTx.filter(x=>x.custId!==d.id); await sSet('custLedgerAccounts', state.custLedgerAccounts); await sSet('custLedgerTx', state.custLedgerTx); render(); } break;
    case 'viewcust': openCustDetail(d.id); break;
    case 'newcusttx': openCustTxForm(d.id, d.type); break;
    case 'delcusttx': if(confirm('Delete this transaction?')){ state.custLedgerTx = state.custLedgerTx.filter(x=>x.id!==d.id); await sSet('custLedgerTx', state.custLedgerTx); openCustDetail(d.cust); } break;
    case 'downloadsummary': {
      const blob = new Blob([buildSummaryText()], {type:'text/plain'});
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'hisaab_summary.txt'; a.click();
      break;
    }
    case 'downloadbackup': {
      const backup = {};
      SHARED_KEYS.forEach(k=> backup[k] = state[k]);
      backup._backupDate = nowStr();
      const blob = new Blob([JSON.stringify(backup, null, 2)], {type:'application/json'});
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'shop_backup_'+new Date().toISOString().slice(0,10)+'.json'; a.click();
      break;
    }
    case 'delreview': if(confirm('Delete this review?')){ state.reviews = state.reviews.filter(r=>r.id!==d.id); await sSet('reviews', state.reviews); render(); } break;
    case 'delorder': if(confirm('Permanently delete this cancelled order? This cannot be undone.')){ state.orders = state.orders.filter(o=>o.id!==d.id); await sSet('orders', state.orders); render(); showToast('Order deleted'); } break;
    case 'editcat': openCategoryForm(d.id); break;
    case 'delcat': if(confirm('Delete this category? Products in it will move to Other.')) await deleteCategory(d.id); break;
    case 'catup': await moveCategory(d.id,-1); break;
    case 'catdown': await moveCategory(d.id,1); break;
    case 'advance': await advanceOrder(d.id); break;
    case 'admincancel': await adminCancelOrder(d.id); break;
    case 'approvecancel': await approveCancel(d.id); break;
    case 'rejectcancel': await rejectCancel(d.id); break;
    case 'genbill': openOrderDetail(d.id, true); break;
    case 'stockadjust': openStockAdjust(d.id, d.dir); break;
    case 'setreport': state.reportRange = d.r; render(); break;
    case 'exportreport': exportReportCsv(); break;
    case 'savesettings': await saveSettings(); break;
    case 'setlogo': state.settings.logo = d.e; await sSet('settings', state.settings); render(); break;
    case 'savesiteurl': {
      state.settings.siteUrl = document.getElementById('s_siteurl').value.trim();
      await sSet('settings', state.settings);
      showToast('Link saved');
      render();
      break;
    }
    case 'copysiteurl': navigator.clipboard?.writeText(state.settings.siteUrl).then(()=>showToast('Link copied')); break;
    case 'savefestivaltoggle': {
      state.settings.festivalActive = document.getElementById('s_festactive').checked;
      await sSet('settings', state.settings);
      showToast('Saved');
      render();
      break;
    }
    case 'newfestbanner': openFestBannerForm(null); break;
    case 'editfestbanner': openFestBannerForm(d.id); break;
    case 'delfestbanner': {
      state.settings.festivalBanners = (state.settings.festivalBanners||[]).filter(b=>b.id!==d.id);
      await sSet('settings', state.settings);
      render();
      break;
    }
    case 'newcustominfo': openCustomInfoForm(); break;
    case 'delcustominfo': state.customInfo = state.customInfo.filter(c=>c.id!==d.id); await sSet('customInfo', state.customInfo); render(); break;
    case 'selectpay': {
      document.querySelectorAll('.pay-option').forEach(p=>p.classList.remove('selected'));
      el.classList.add('selected');
      const r = el.querySelector('input'); if(r) r.checked = true;
      state._payMethod = d.m;
      const box = document.getElementById('upiBox'); if(box) box.style.display = d.m==='UPI' ? 'block':'none';
      break;
    }
    case 'copyupi': navigator.clipboard?.writeText(state.settings.upi).then(()=>showToast('UPI ID copied')); break;
    case 'placeorder': await placeOrder(); break;
  }
}

async function addToCart(productId, delta){
  const p = productById(productId); if(!p) return;
  let item = state.cart.find(i=>i.productId===productId);
  if(!item){ if(delta<=0) return; item = {productId, qty:0}; state.cart.push(item); }
  item.qty = Math.max(0, Math.min(p.availableQty, item.qty+delta));
  state.cart = state.cart.filter(i=>i.qty>0);
  await pSet('cart', state.cart);
  render();
}

  `, false);

  });
}
let _qrLibPromise = null;
function loadQRLib(){
  if(window.QRCode) return Promise.resolve();
  if(_qrLibPromise) return _qrLibPromise;
  _qrLibPromise = new Promise((resolve)=>{
    const s = document.createElement('script');
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js";
    s.onload = ()=> resolve();
    s.onerror = ()=> resolve(); // fail silently — checkout still works without the QR image
    document.head.appendChild(s);
    setTimeout(resolve, 3000); // don't block checkout forever if the network is slow/unavailable
  });
  return _qrLibPromise;
}



async function placeOrder(){
  const name = document.getElementById('co_name').value.trim();
  const mobile = document.getElementById('co_mobile').value.trim();
  const address = document.getElementById('co_address').value.trim();
  const notes = document.getElementById('co_notes').value.trim();
  if(!name || !mobile || !address){ alert('Please fill your name, mobile number and address.'); return; }
  if(cartTotal() < state.settings.minOrder){ alert('Minimum order amount is '+money(state.settings.minOrder)); return; }

  const cu = currentCustomer();
  if(cu){
    cu.name = name;
    cu.addresses = cu.addresses||[];
    if(!cu.addresses.includes(address)) cu.addresses.unshift(address);
    await sSet('customers', state.customers);
  }

  // Skip any stale cart entries whose product no longer exists (can happen after
  // a data reset/reseed) instead of crashing the checkout.
  const staleItems = state.cart.filter(i=>!productById(i.productId));
  if(staleItems.length){
    state.cart = state.cart.filter(i=>productById(i.productId));
    await pSet('cart', state.cart);
  }
  const items = state.cart.map(i=>{ const p=productById(i.productId); return {productId:p.id, name:p.name, qty:i.qty, price:p.sellingPrice, unit:p.unit}; });
  if(!items.length){ alert('Some items in your cart are no longer available. Please add products again.'); closeModal(); state.shopTab='cart'; render(); return; }
  const dc = state.settings.deliveryCharge;
  const subtotal = cartTotal();
  const coupon = getAppliedCoupon();
  const discount = coupon ? couponDiscountAmount(coupon, subtotal) : 0;
  const grand = Math.max(0, subtotal-discount)+dc;
  const order = {
    id: uid('ord_'), invoiceNo:null, customerName:name, mobile, address, items,
    subtotal, deliveryCharge: dc, discount, couponCode: coupon?coupon.code:null, grandTotal: grand,
    paymentMethod: state._payMethod||'UPI', notes, status:'New', cancelRequested:false, cancelReason:null,
    createdAt: Date.now(), createdAtStr: nowStr()
  };
  state.orders.unshift(order);
  await sSet('orders', state.orders);

  // reduce stock
  for(const it of items){ await adjustStock(it.productId, -it.qty, 'Order '+order.id.slice(-5)+' placed'); }

  state.cart = []; await pSet('cart', []);
  state.appliedCoupon = null;
  closeModal();
  state.shopTab='orders'; render();
  showToast('Order placed successfully!');

  // Offer WhatsApp send as a direct tappable link (not auto-opened) — browsers/Android
  // block or mis-handle app-links triggered programmatically after a delay, so a real,
  // fresh tap on an actual link is the only reliable way to hand off to the WhatsApp app.
  const msg = `Shop Name: ${state.settings.shopName}\nCustomer Name: ${name}\nMobile Number: ${mobile}\nOrder Number: ${order.id.slice(-5)}\nProducts:\n${items.map((i,idx)=>`${idx+1}. ${i.name} x${i.qty}`).join('\n')}\nQuantity: ${items.reduce((s,i)=>s+i.qty,0)}\nTotal Amount: ${money(grand)}\nDelivery Address: ${address}\nPayment: ${order.paymentMethod}`;
  openWhatsAppPrompt(state.settings.whatsapp, msg);
}

    <label class="field">Description</label><textarea class="input" id="pf_desc">${p?escapeHtml(p.description):''}</textarea>
    <div style="display:flex;gap:10px;">
      <div style="flex:1;"><label class="field">Selling Price (₹)</label><input type="number" class="input" id="pf_sp" value="${p?p.sellingPrice:''}"></div>
      <div style="flex:1;"><label class="field">MRP (₹)</label><input type="number" class="input" id="pf_mrp" value="${p?p.mrp:''}"></div>
    </div>
    <div style="display:flex;gap:10px;">
      <div style="flex:1;"><label class="field">Unit</label><select class="input" id="pf_unit">${['kg','gram','litre','ml','piece','packet'].map(u=>`<option ${p&&p.unit===u?'selected':''}>${u}</option>`).join('')}</select></div>
      <div style="flex:1;"><label class="field">Available Qty</label><input type="number" class="input" id="pf_qty" value="${p?p.availableQty:'0'}"></div>
    </div>
    <label class="field">SKU / Product Code</label><input class="input" id="pf_sku" value="${p?escapeHtml(p.sku):'SKU'+Math.floor(1000+Math.random()*9000)}">
    <label class="field">Free Gift / Combo Offer (optional)</label><input class="input" id="pf_freebie" value="${p&&p.freebie?escapeHtml(p.freebie):''}" placeholder="e.g. Buy 1 Get 1 Free, Free soap included">
    <div class="chk"><input type="checkbox" id="pf_featured" ${p&&p.featured?'checked':''}> Featured product</div>
    <div class="chk"><input type="checkbox" id="pf_active" ${!p||p.active?'checked':''}> Active (visible to customers)</div>
    <button class="btn btn-leaf btn-block" id="pfSave">${p?'Save Changes':'Add Product'}</button>
  `, false);

  function renderImgRow(){
    const el = document.getElementById('pf_imgrow');
    if(!el) return;
    el.innerHTML = (formImages.length ? formImages.map((img,i)=>`
      <div class="imgpick"><div class="pic-inner">${imgOrEmoji(img)}</div><button class="rm" data-rmidx="${i}">✕</button></div>
    `).join('') : `<div class="tiny" style="padding:6px 0;">No photo yet — a default 🛒 icon will be used.</div>`);
    el.querySelectorAll('[data-rmidx]').forEach(b=>{
      b.onclick = ()=>{ formImages.splice(Number(b.dataset.rmidx),1); renderImgRow(); };
    });
  }
  renderImgRow();

  setTimeout(()=>{
    document.getElementById('pf_imgfile').onchange = async (e)=>{
      const files = Array.from(e.target.files||[]);
      for(const f of files){
        const placeholderIdx = formImages.length;
        formImages.push('⏳'); // show a spinner-ish placeholder while this photo uploads
        renderImgRow();
        try{
          const durl = await fileToResizedDataUrl(f);
          const url = await uploadToImgbb(durl);
          formImages[placeholderIdx] = url;
        }catch(err){
          console.error(err);
          formImages.splice(placeholderIdx,1);
          alert('⚠️ Photo upload failed: '+err.message+'\n\nProduct ko photo ke bina hi Save kar sakte ho, ya dobara try karo.');
        }
        renderImgRow();
      }
      e.target.value = '';
    };
    document.querySelectorAll('[data-act="picksymbol"]').forEach(b=>{
      b.onclick = ()=>{ formImages.push(b.dataset.e); renderImgRow(); };
    });
    document.getElementById('pfSave').onclick = async ()=>{
      if(formImages.includes('⏳')){ alert('Photo abhi upload ho rahi hai — thoda ruko fir Save dabao.'); return; }
      const data = {
        name: document.getElementById('pf_pname').value.trim(),
        category: document.getElementById('pf_cat').value,
        images: formImages.length ? formImages : ['🛒'],
        description: document.getElementById('pf_desc').value.trim(),
        sellingPrice: Number(document.getElementById('pf_sp').value)||0,
        mrp: Number(document.getElementById('pf_mrp').value)||0,
        unit: document.getElementById('pf_unit').value,
        availableQty: Number(document.getElementById('pf_qty').value)||0,
        sku: document.getElementById('pf_sku').value.trim(),
        freebie: document.getElementById('pf_freebie').value.trim(),
        featured: document.getElementById('pf_featured').checked,
        active: document.getElementById('pf_active').checked,
      };
      if(!data.name){ alert('Product name is required.'); return; }
      let isNew = false;
      if(p){ Object.assign(p, data); }
      else { state.products.push({id:uid('p_'), ...data}); isNew = true; }
      const ok = await sSet('products', state.products);
      closeModal(); render();
      if(ok) showToast(p?'Product updated':'Product added');
      else if(isNew) state.products.pop(); // save failed — don't leave a phantom local-only product; re-render below
      if(!ok) render();
    };
  },30);
}

      <div style="flex:1;"><label class="field">Discount Value</label><input type="number" class="input" id="cp_value" value="${c?c.value:''}" placeholder="e.g. 10"></div>
      <div style="flex:1;"><label class="field">Max Discount (₹, optional)</label><input type="number" class="input" id="cp_max" value="${c&&c.maxDiscount?c.maxDiscount:''}" placeholder="only for %"></div>
    </div>
    <label class="field">Minimum Order Amount (₹, optional)</label><input type="number" class="input" id="cp_minorder" value="${c&&c.minOrder?c.minOrder:''}" placeholder="e.g. 199">
    <label class="field">Description (optional)</label><input class="input" id="cp_desc" value="${c&&c.description?escapeHtml(c.description):''}" placeholder="e.g. Welcome offer for new customers">
    <div class="chk"><input type="checkbox" id="cp_active" ${!c||c.active?'checked':''}> Active (customers can use it now)</div>
    <button class="btn btn-leaf btn-block" id="cpSave">${c?'Save Changes':'Add Coupon'}</button>
  `, true);
  setTimeout(()=>{
    document.getElementById('cpSave').onclick = async ()=>{
      const code = document.getElementById('cp_code').value.trim().toUpperCase();
      const value = Number(document.getElementById('cp_value').value)||0;
      if(!code){ alert('Coupon code is required.'); return; }
      if(value<=0){ alert('Discount value must be greater than 0.'); return; }
      const dupe = state.coupons.find(x=>x.code.toUpperCase()===code && (!c || x.id!==c.id));
      if(dupe){ alert('A coupon with this code already exists.'); return; }
      const data = {
        code,
        type: document.getElementById('cp_type').value,
        value,
        maxDiscount: Number(document.getElementById('cp_max').value)||0,
        minOrder: Number(document.getElementById('cp_minorder').value)||0,
        description: document.getElementById('cp_desc').value.trim(),
        active: document.getElementById('cp_active').checked,
      };
      if(c){ Object.assign(c, data); }
      else { state.coupons.push({id:uid('cpn_'), ...data}); }
      await sSet('coupons', state.coupons);
      closeModal(); render();
      showToast(c?'Coupon updated':'Coupon added');
    };
  },30);
}

function openCategoryForm(id){
  const c = id ? state.categories.find(c=>c.id===id) : null;
  let formImage = c ? (c.image||'') : '';
  openModal(`
    <div class="modal-head"><h3>${c?'Edit':'Add'} Category</h3><button class="xbtn" data-act="closemodal">✕</button></div>
    <label class="field">Category Name</label><input class="input" id="cf_name" value="${c?escapeHtml(c.name):''}">
    <label class="field">Category Photo</label>
    <div class="imgrow" id="cf_imgrow"></div>
    <label class="btn btn-outline btn-block" style="display:block;text-align:center;margin-bottom:6px;">
      📷 Upload from Gallery / Camera
      <input type="file" id="cf_imgfile" accept="image/*" style="display:none;">
    </label>
    <div class="tiny" style="margin-bottom:10px;">Or tap an icon below if you don't have a photo yet:</div>
    <div class="emoji-grid">${EMOJIS.map(e=>`<button data-act="pickcatsymbol" data-e="${e}">${e}</button>`).join('')}</div>
    <button class="btn btn-leaf btn-block" id="cfSave">${c?'Save':'Add Category'}</button>
  `, true);

  function renderCfImg(){
    const el = document.getElementById('cf_imgrow');
    if(!el) return;
    el.innerHTML = formImage ? `<div class="imgpick">${imgOrEmoji(formImage)}<button class="rm" id="cfImgRm">✕</button></div>` : `<div class="tiny" style="padding:6px 0;">No photo yet — a default 🛒 icon will be used.</div>`;
    const rm = document.getElementById('cfImgRm');
    if(rm) rm.onclick = ()=>{ formImage=''; renderCfImg(); };
  }
  renderCfImg();

  setTimeout(()=>{
    document.getElementById('cf_imgfile').onchange = async (e)=>{
      const f = (e.target.files||[])[0];
      if(!f) return;
      try{ formImage = await fileToResizedDataUrl(f); renderCfImg(); }
      catch(err){ console.error(err); alert('Could not read that image.'); }
      e.target.value = '';
    };
    document.querySelectorAll('[data-act="pickcatsymbol"]').forEach(b=>{
      b.onclick = ()=>{ formImage = b.dataset.e; renderCfImg(); };
    });
    document.getElementById('cfSave').onclick = async ()=>{
      const name = document.getElementById('cf_name').value.trim();
      if(!name) return;
      if(c){ c.name = name; c.image = formImage; }
      else state.categories.push({id:uid('cat_'), name, order: state.categories.length, image: formImage});
      await sSet('categories', state.categories);
      closeModal(); render();
    };
  },30);
}
async function deleteCategory(id){
  const other = state.categories.find(c=>c.name==='Other') || state.categories[0];
  state.products.forEach(p=>{ if(p.category===id) p.category = other.id; });
  state.categories = state.categories.filter(c=>c.id!==id);
  await sSet('categories', state.categories);
  await sSet('products', state.products);
  render();
}
async function moveCategory(id, dir){
  const sorted = state.categories.sort((a,b)=>a.order-b.order);
  const idx = sorted.findIndex(c=>c.id===id);
  const swapIdx = idx+dir;
  if(swapIdx<0 || swapIdx>=sorted.length) return;
  const tmp = sorted[idx].order; sorted[idx].order = sorted[swapIdx].order; sorted[swapIdx].order = tmp;
  await sSet('categories', state.categories);
  render();
}

async function advanceOrder(id){
  const steps = ["New","Confirmed","Preparing","Out","Delivered"];
  const o = state.orders.find(o=>o.id===id);
  const idx = steps.indexOf(o.status);
  if(idx<steps.length-1){ o.status = steps[idx+1]; await sSet('orders', state.orders); render(); showToast('Order moved to '+o.status); }
}
async function adminCancelOrder(id){
  const reason = prompt('Reason for cancelling this order:') || 'Cancelled by admin';
  const o = state.orders.find(o=>o.id===id);
  o.status='Cancelled'; o.cancelReason=reason; o.cancelRequested=false;
  await sSet('orders', state.orders);
  for(const it of o.items){ await adjustStock(it.productId, it.qty, 'Order '+o.id.slice(-5)+' cancelled — stock restored'); }
  render();
}
async function approveCancel(id){
  const o = state.orders.find(o=>o.id===id);
  o.status='Cancelled'; o.cancelRequested=false;
  await sSet('orders', state.orders);
  for(const it of o.items){ await adjustStock(it.productId, it.qty, 'Order '+o.id.slice(-5)+' cancellation approved — stock restored'); }
  render();
}
async function rejectCancel(id){
  const o = state.orders.find(o=>o.id===id);
  o.cancelRequested=false;
  await sSet('orders', state.orders);
  render();
}

function openStockAdjust(id, dir){
  const p = productById(id);
  openModal(`
    <div class="modal-head"><h3>${dir==='add'?'Add':'Remove'} Stock — ${escapeHtml(p.name)}</h3><button class="xbtn" data-act="closemodal">✕</button></div>
    <div class="tiny" style="margin-bottom:10px;">Current stock: ${p.availableQty} ${p.unit}</div>
    <label class="field">Quantity</label><input type="number" class="input" id="sa_qty" min="1" value="1">
    <label class="field">Reason</label><input class="input" id="sa_reason" placeholder="${dir==='add'?'e.g. new stock arrived':'e.g. damaged / expired'}">
    <button class="btn btn-leaf btn-block" id="saConfirm">Confirm</button>
  `, true);
  setTimeout(()=>{
    document.getElementById('saConfirm').onclick = async ()=>{
      const qty = Number(document.getElementById('sa_qty').value)||0;
      const reason = document.getElementById('sa_reason').value.trim() || (dir==='add'?'Stock added':'Stock removed');
      if(qty<=0) return;
      await adjustStock(id, dir==='add'?qty:-qty, reason);
      closeModal(); render();
    };
  },30);
}

function exportReportCsv(){
  const rows = [["Order ID","Invoice","Customer","Mobile","Status","Payment","Total","Date"]];
  state.orders.forEach(o=> rows.push([o.id, o.invoiceNo||'', o.customerName, o.mobile, o.status, o.paymentMethod, o.grandTotal, o.createdAtStr]));
  const csv = rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'sales_report.csv'; a.click();
}

async function saveSettings(){
  const s = state.settings;
  s.shopName = document.getElementById('s_shopName').value.trim();
  s.address = document.getElementById('s_address').value.trim();
  s.phone = document.getElementById('s_phone').value.trim();
  s.whatsapp = document.getElementById('s_whatsapp').value.trim().replace(/\D/g,'');
  s.upi = document.getElementById('s_upi').value.trim();
  s.email = document.getElementById('s_email').value.trim();
  s.openTime = document.getElementById('s_open').value;
  s.closeTime = document.getElementById('s_close').value;
  s.deliveryCharge = Number(document.getElementById('s_delivery').value)||0;
  s.minOrder = Number(document.getElementById('s_minorder').value)||0;
  s.deliveryArea = document.getElementById('s_area').value.trim();
  s.about = document.getElementById('s_about').value.trim();
  s.terms = document.getElementById('s_terms').value.trim();
  s.privacy = document.getElementById('s_privacy').value.trim();
  s.adminPassword = document.getElementById('s_password').value.trim() || s.adminPassword;
  await sSet('settings', s);
  showToast('Settings saved');
  render();
}

function openCustomInfoForm(){
  openModal(`
    <div class="modal-head"><h3>Add Shop Information</h3><button class="xbtn" data-act="closemodal">✕</button></div>
    <label class="field">Title</label><input class="input" id="ci_title" placeholder="e.g. Diwali Offer">
    <label class="field">Details</label><textarea class="input" id="ci_content" placeholder="e.g. Flat 10% off on all cosmetics till 15th Oct"></textarea>
    <button class="btn btn-leaf btn-block" id="ciSave">Add</button>
  `, true);
  setTimeout(()=>{
    document.getElementById('ciSave').onclick = async ()=>{
      const title = document.getElementById('ci_title').value.trim();
      const content = document.getElementById('ci_content').value.trim();
      if(!title) return;
      state.customInfo.push({id:uid('ci_'), title, content});
      await sSet('customInfo', state.customInfo);
      closeModal(); render();
    };
  },30);
}

loadAll();
window.addEventListener('focus', ()=>{ if(sharedCache && !modalHTML) refreshShared(); });
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible' && sharedCache && !modalHTML) refreshShared(); });
