<script>
window.onerror = function(msg, src, line, col, err){
  // Generic "Script error." with no line/col info comes from cross-origin/injected
  // scripts (browser extensions, OS overlays) — not from our own code. Ignore those.
  if(msg === 'Script error.' && !line && !col) return;
  document.getElementById('root').innerHTML =
    '<div style="padding:30px;font-family:monospace;font-size:13px;white-space:pre-wrap;color:#b6472f;">'+
    '⚠️ App error:\n' + msg + '\nLine: ' + line + ':' + col + '\n\n' + (err && err.stack ? err.stack : '') +
    '</div>';
};
window.onunhandledrejection = function(event){
  const reason = event.reason;
  if(!reason) return;
  alert('⚠️ Error: ' + (reason.message ? reason.message : reason) + (reason.stack ? '\n\n'+reason.stack : ''));
};
</script>

<script>
const EMOJIS = ["🛒","🧺","🧴","🧼","🧻","🍚","🌾","🥫","🧂","🍬","🍫","🥤","🧃","🥛","🧈","🍞","🧊","🪥","🧹","🧽","🧴","💄","🧴","🧴","🕯️","🔋","🧦","🧻","🍎","🥔","🧅","🧄","🥚","☕","🍵","🧊"];

// ============================================================
// JSONBIN CONFIG — data is split across TWO bins to stay under
// JSONBin's free-plan 100KB-per-record limit:
//  - CORE_BIN: settings, catalog, people (changes less often / grows slowly)
//  - ACTIVITY_BIN: orders, stock history, ledgers, reviews (keeps growing)
// ============================================================
const JSONBIN_KEY = "$2a$10$cpb6il6SmpYysUvSpEywH.mX4XUg56W35nSxcCEMjKZRK18pey6tm";
const CORE_BIN = "6a9d2567f5f4af5e29709661";
const ACTIVITY_BIN = "6a9e8ed0ac6210605aaf2ca2";
const BIN_URLS = {
  core: "https://api.jsonbin.io/v3/b/" + CORE_BIN,
  activity: "https://api.jsonbin.io/v3/b/" + ACTIVITY_BIN
};
const ACTIVITY_KEYS = ["orders","stockHistory","reviews","ledger","dealerTx","custLedgerTx","memoCounter"];
function binForKey(key){ return ACTIVITY_KEYS.includes(key) ? "activity" : "core"; }

// All shared shop data (settings, products, orders, etc.) lives in these bins,
// so every customer's phone and the admin panel see the SAME data. We keep a
// local copy per bin (sharedCache) and re-fetch whenever the person switches
// screens, so it stays reasonably fresh without hammering the free request
// quota with constant background polling.
let sharedCache = { core: null, activity: null };

async function fetchSharedBin(which){
  const res = await fetch(BIN_URLS[which] + "/latest", { headers: { "X-Access-Key": JSONBIN_KEY } });
  if(!res.ok){
    const txt = await res.text().catch(()=>'');
    throw new Error('Load failed ('+which+', HTTP '+res.status+') '+txt.slice(0,150));
  }
  const data = await res.json();
  sharedCache[which] = data.record || {};
  return sharedCache[which];
}
async function pushSharedBin(which){
  const res = await fetch(BIN_URLS[which], {
    method: "PUT",
    headers: { "Content-Type": "application/json", "X-Access-Key": JSONBIN_KEY },
    body: JSON.stringify(sharedCache[which])
  });
  if(!res.ok){
    const txt = await res.text().catch(()=>'');
    throw new Error('Save failed ('+which+', HTTP '+res.status+') '+txt.slice(0,150));
  }
}
const SHARED_KEYS = ["settings","categories","products","orders","stockHistory","customInfo","customers","invoiceCounter","offers","reviews","ledger","memoCounter","dealers","dealerTx","custLedgerAccounts","custLedgerTx"];

// ---------- storage helpers ----------
async function sGet(key, fallback){
  const which = binForKey(key);
  try{
    if(!sharedCache[which]) await fetchSharedBin(which);
  }catch(e){
    console.error("Could not reach JSONBin", e);
    showToast('⚠️ Cloud load error: '+e.message);
    if(!sharedCache[which]) sharedCache[which] = {};
  }
  return (sharedCache[which] && sharedCache[which][key] !== undefined) ? sharedCache[which][key] : fallback;
}
async function sSet(key, val){
  const which = binForKey(key);
  try{
    await fetchSharedBin(which); // always pull the latest first, so we don't overwrite other browsers' changes
    sharedCache[which][key] = val;
    await pushSharedBin(which);
  }catch(e){
    console.error("Could not save to JSONBin", e);
    showToast('⚠️ Cloud save error: '+e.message);
    if(!sharedCache[which]) sharedCache[which] = {};
    sharedCache[which][key] = val; // keep it locally at least, so this session still works
  }
}
async function refreshShared(){
  try{
    await Promise.all(["core","activity"].map(fetchSharedBin));
    SHARED_KEYS.forEach(k=>{
      const which = binForKey(k);
      if(sharedCache[which] && sharedCache[which][k] !== undefined) state[k] = sharedCache[which][k];
    });
  }catch(e){
    console.error("Could not refresh from JSONBin", e);
    showToast('⚠️ Could not refresh: '+e.message);
  }
  render();
}
// Personal data (cart, login session) stays on this device only — plain localStorage.
async function pGet(key, fallback){
  try{ const v = localStorage.getItem('mks_'+key); return v!=null ? JSON.parse(v) : fallback; }
  catch(e){ return fallback; }
}
async function pSet(key, val){
  try{ localStorage.setItem('mks_'+key, JSON.stringify(val)); }
  catch(e){ console.error('localStorage write failed for '+key, e); }
}

function uid(prefix){ return prefix + Math.random().toString(36).slice(2,9); }
function money(n){ return "₹" + Number(n||0).toFixed(0); }
function nowStr(){ return new Date().toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'}); }
function imgOrEmoji(img){
  if(img && img.startsWith('data:')) return `<img src="${img}" style="width:100%;height:100%;object-fit:cover;display:block;">`;
  return img || '🛒';
}
function fileToResizedDataUrl(file, maxDim, quality){
  maxDim = maxDim || 220; quality = quality || 0.45;
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = reject;
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > h){ if(w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; } }
        else { if(h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; } }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

// ---------- derived helpers ----------
function catName(id){ const c = state.categories.find(c=>c.id===id); return c?c.name:"Other"; }
function productById(id){ return state.products.find(p=>p.id===id); }
function productReviews(productId){ return state.reviews.filter(r=>r.productId===productId).sort((a,b)=>b.date_ts-a.date_ts); }
function productRating(productId){
  const list = productReviews(productId);
  if(!list.length) return {avg:0, count:0};
  const avg = list.reduce((s,r)=>s+r.rating,0) / list.length;
  return {avg, count: list.length};
}
function starsHTML(avg, size){
  size = size || 13;
  let out = '';
  for(let i=1;i<=5;i++){ out += `<span style="font-size:${size}px;color:${i<=Math.round(avg)?'#e2a125':'#ddd8c8'};">★</span>`; }
  return out;
}
function inDateRange(ts, range){
  const d = new Date(ts);
  const now = new Date();
  if(range==='today') return d.toDateString()===now.toDateString();
  if(range==='yesterday'){ const y=new Date(now); y.setDate(y.getDate()-1); return d.toDateString()===y.toDateString(); }
  if(range==='week'){ const w=new Date(now); w.setDate(w.getDate()-7); return d>=w; }
  if(range==='month'){ const m=new Date(now); m.setDate(1); m.setHours(0,0,0,0); return d>=m; }
  return true;
}
function dealerTxList(dealerId){ return state.dealerTx.filter(t=>t.dealerId===dealerId).sort((a,b)=>b.date_ts-a.date_ts); }
function dealerBalance(dealerId){
  return state.dealerTx.filter(t=>t.dealerId===dealerId).reduce((s,t)=> s + (t.type==='purchase'? t.amount : -t.amount), 0);
}
function custTxList(custId){ return state.custLedgerTx.filter(t=>t.custId===custId).sort((a,b)=>b.date_ts-a.date_ts); }
function custBalance(custId){
  return state.custLedgerTx.filter(t=>t.custId===custId).reduce((s,t)=> s + (t.type==='credit'? t.amount : -t.amount), 0);
}
function cartCount(){ return state.cart.reduce((s,i)=>s+i.qty,0); }
function cartTotal(){ return state.cart.reduce((s,i)=>{ const p=productById(i.productId); return p? s+p.sellingPrice*i.qty : s; },0); }
function currentCustomer(){ return (state.session && state.session.mobile) ? state.customers.find(c=>c.mobile===state.session.mobile) : null; }
function myOrders(){ const cu = currentCustomer(); return cu ? state.orders.filter(o=>o.mobile===cu.mobile).sort((a,b)=>b.createdAt-a.createdAt) : []; }

function waLink(number, text){ return "https://wa.me/"+number+"?text="+encodeURIComponent(text); }

// ---------- stock ----------
async function adjustStock(productId, delta, reason){
  const p = productById(productId); if(!p) return;
  const prev = p.availableQty;
  p.availableQty = Math.max(0, prev + delta);
  state.stockHistory.unshift({id:uid('sh_'), productId, productName:p.name, prev, added: delta>0?delta:0, removed: delta<0?-delta:0, newStock:p.availableQty, date: nowStr(), reason});
  await sSet('products', state.products);
  await sSet('stockHistory', state.stockHistory);
}

function render(){
  const root = document.getElementById('root');
  if(!state.settings){
    root.innerHTML = `<div class="section" style="padding-top:60px;text-align:center;">
      <div style="font-size:38px;">⏳</div>
      <div class="h2">Loading shop data...</div>
      <div class="sub">${state.toast ? escapeHtml(state.toast) : 'Connecting to the cloud store'}</div>
    </div>`;
    return;
  }
  root.innerHTML = topbarHTML() + (state.mode==='shop' ? shopHTML() : adminHTML()) + (state.toast? `<div class="toast">${escapeHtml(state.toast)}</div>` : "");
  attachEvents();
  if(state.mode==='admin' && state.adminLoggedIn && state.adminTab==='settings' && state.settings.siteUrl){
    loadQRLib().then(()=>{
      const el = document.getElementById('shopQr');
      if(el && window.QRCode){ el.innerHTML=''; new QRCode(el, {text: state.settings.siteUrl, width:150, height:150}); }
    });
  }
}
function escapeHtml(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

  const cat = catName(p.category);
  const out = p.availableQty<=0;
  const disc = p.mrp>p.sellingPrice ? Math.round((1-p.sellingPrice/p.mrp)*100) : 0;
  const rating = productRating(p.id);
  return `<div class="pcard ${out?'stock-out':''}">
    <div class="img" data-act="viewproduct" data-id="${p.id}">${disc>0?`<div class="badge">${disc}% OFF</div>`:''}${imgOrEmoji(p.images && p.images[0])}</div>
    <div class="body">

      <div class="unit">${escapeHtml(cat)} • ${escapeHtml(p.unit)}</div>
      ${rating.count? `<div style="margin-top:2px;">${starsHTML(rating.avg,11)} <span class="tiny">(${rating.count})</span></div>` : ''}
      <div class="price-row"><span class="price">${money(p.sellingPrice)}</span>${p.mrp>p.sellingPrice?`<span class="mrp">${money(p.mrp)}</span>`:''}</div>

function orderStatusSteps(o){
  const steps = ["New","Confirmed","Preparing","Out","Delivered"];
  const labels = {New:"New Order",Confirmed:"Confirmed",Preparing:"Preparing",Out:"Out for Delivery",Delivered:"Delivered"};
  if(o.status==='Cancelled') return `<span class="status-pill status-Cancelled">Cancelled</span>`;
  return steps.map(s=>`<span class="status-pill status-${s}" style="opacity:${steps.indexOf(s)<=steps.indexOf(o.status)?1:.35}">${labels[s]}</span>`).join(' → ');
}

function orderCardHTML(o, isAdmin){
  const canCancel = !isAdmin && !['Delivered','Cancelled'].includes(o.status) && !o.cancelRequested;
  return `<div class="card">
    <div class="row">
      <div><b>#${o.invoiceNo||o.id.slice(-5)}</b><div class="tiny">${o.createdAtStr}</div></div>
      ${isAdmin?`<span class="status-pill status-${o.status}">${o.status}</span>`:''}
    </div>
    <div style="margin:8px 0;">${orderStatusSteps(o)}</div>
    <div class="tiny">${o.items.length} item(s) • ${money(o.grandTotal)} • ${o.paymentMethod}</div>
    ${isAdmin? `<div class="tiny">${escapeHtml(o.customerName)} • ${escapeHtml(o.mobile)}<br>${escapeHtml(o.address)}</div>`:''}
    ${o.cancelRequested? `<div class="tiny" style="color:var(--brick);margin-top:6px;">Cancellation requested by customer${o.cancelReason?': '+escapeHtml(o.cancelReason):''}</div>`:''}
    <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;">
      <button class="btn btn-outline btn-sm" data-act="vieworder" data-id="${o.id}">${t('viewDetails')}</button>
      ${canCancel? `<button class="btn btn-outline btn-sm" data-act="reqcancel" data-id="${o.id}">${t('requestCancellation')}</button>`:''}
      ${isAdmin? adminOrderActions(o):''}
    </div>
  </div>`;
}
function adminOrderActions(o){
  const steps = ["New","Confirmed","Preparing","Out","Delivered"];
  const idx = steps.indexOf(o.status);
  let html = "";
  if(o.status!=='Cancelled' && idx<steps.length-1){
    html += `<button class="btn btn-leaf btn-sm" data-act="advance" data-id="${o.id}">Move to ${({New:"Confirmed",Confirmed:"Preparing",Preparing:"Out for Delivery",Out:"Delivered"})[o.status]}</button>`;
  }
  if(o.cancelRequested){
    html += `<button class="btn btn-brick btn-sm" data-act="approvecancel" data-id="${o.id}">Approve Cancel</button>`;
    html += `<button class="btn btn-outline btn-sm" data-act="rejectcancel" data-id="${o.id}">Reject</button>`;
  } else if(o.status!=='Delivered' && o.status!=='Cancelled'){
    html += `<button class="btn btn-outline btn-sm" data-act="admincancel" data-id="${o.id}">Cancel Order</button>`;
  }
  html += `<button class="btn btn-turm btn-sm" data-act="genbill" data-id="${o.id}">Invoice</button>`;
  if(o.status==='Cancelled'){
    html += `<button class="btn btn-brick btn-sm" data-act="delorder" data-id="${o.id}">Delete Order</button>`;
  }
  return html;
}

  const todayPurchases = todayLedger.filter(e=>e.type==='purchase').reduce((s,e)=>s+e.amount,0);

function buildSummaryText(){
  const orders = state.orders;
  const totalSales = orders.filter(o=>o.status!=='Cancelled').reduce((s,o)=>s+o.grandTotal,0);
  const totalPurchaseLedger = state.ledger.filter(e=>e.type==='purchase').reduce((s,e)=>s+e.amount,0);
  const totalCashSales = state.ledger.filter(e=>e.type==='sale').reduce((s,e)=>s+e.amount,0);
  const totalDealerPayable = state.dealers.reduce((s,d)=>s+Math.max(0,dealerBalance(d.id)),0);
  const totalCustReceivable = state.custLedgerAccounts.reduce((s,c)=>s+Math.max(0,custBalance(c.id)),0);
  const profit = (totalSales+totalCashSales) - totalPurchaseLedger;
  let txt = `${state.settings.shopName} — Hisaab Summary\nDate: ${nowStr()}\n\n`;
  txt += `Total Sale: ${money(totalSales+totalCashSales)}\nTotal Purchase: ${money(totalPurchaseLedger)}\nProfit: ${money(profit)}\n\n`;
  txt += `Dealer Payable (aapko dena hai): ${money(totalDealerPayable)}\n`;
  state.dealers.forEach(d=>{ const b=dealerBalance(d.id); if(b>0) txt += `  - ${d.name}: ${money(b)}\n`; });
  txt += `\nCustomer Receivable (aapko milna hai): ${money(totalCustReceivable)}\n`;
  state.custLedgerAccounts.forEach(c=>{ const b=custBalance(c.id); if(b>0) txt += `  - ${c.name}: ${money(b)}\n`; });
  return txt;
}

function adminReportsHTML(){
  const range = state.reportRange || 'today';
  const now = new Date();
  function inRange(o){
    const d = new Date(o.createdAt);
    if(range==='today') return d.toDateString()===now.toDateString();
    if(range==='yesterday'){ const y=new Date(now); y.setDate(y.getDate()-1); return d.toDateString()===y.toDateString(); }
    if(range==='week'){ const w=new Date(now); w.setDate(w.getDate()-7); return d>=w; }
    if(range==='month'){ const m=new Date(now); m.setDate(m.getDate()-30); return d>=m; }
    return true;
  }
  const set = state.orders.filter(inRange);
  const sales = set.filter(o=>o.status!=='Cancelled').reduce((s,o)=>s+o.grandTotal,0);
  const delivered = set.filter(o=>o.status==='Delivered').length;
  const cancelled = set.filter(o=>o.status==='Cancelled').length;
  const pending = set.filter(o=>!['Delivered','Cancelled'].includes(o.status)).length;
  const prodAgg = {};
  set.forEach(o=>{ if(o.status==='Cancelled') return; o.items.forEach(it=>{ prodAgg[it.name]=(prodAgg[it.name]||0)+it.qty; }); });
  const best = Object.entries(prodAgg).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const catAgg = {};
  set.forEach(o=>{ if(o.status==='Cancelled') return; o.items.forEach(it=>{ const p=productById(it.productId); const cn = p?catName(p.category):'Other'; catAgg[cn]=(catAgg[cn]||0)+it.qty*it.price; }); });

  return `<div class="section">
    <div class="h2">Sales Report</div>
    <div class="chips" style="padding-left:0;">
      ${[['today','Today'],['yesterday','Yesterday'],['week','This Week'],['month','This Month'],['all','All Time']].map(([k,l])=>`<button class="chip ${range===k?'active':''}" data-act="setreport" data-r="${k}">${l}</button>`).join('')}
    </div>
  </div>
  <div class="stat-grid">
    <div class="stat"><div class="v">${money(sales)}</div><div class="l">Total Sales</div></div>
    <div class="stat"><div class="v">${set.length}</div><div class="l">Orders</div></div>
    <div class="stat"><div class="v">${delivered}</div><div class="l">Delivered</div></div>
    <div class="stat"><div class="v">${pending}</div><div class="l">Pending</div></div>
    <div class="stat"><div class="v">${cancelled}</div><div class="l">Cancelled</div></div>
  </div>
  <div class="section">
    <div class="card"><b>Best-selling products</b>${best.length?best.map(([n,q])=>`<div class="list-row"><div>${escapeHtml(n)}</div><div class="tiny">${q} sold</div></div>`).join(''):`<div class="tiny">No sales in this range.</div>`}</div>
    <div class="card"><b>Revenue by category</b>${Object.keys(catAgg).length?Object.entries(catAgg).map(([n,v])=>`<div class="list-row"><div>${escapeHtml(n)}</div><div class="tiny">${money(v)}</div></div>`).join(''):`<div class="tiny">No sales in this range.</div>`}</div>
    <button class="btn btn-outline btn-block" data-act="exportreport">Export report (CSV)</button>
  </div>`;
}

// ---------- modal system ----------
let modalHTML = null;
function openModal(html, center){ modalHTML = html; renderModal(center); }
function closeModal(){ modalHTML = null; const el=document.getElementById('modalRoot'); if(el) el.remove(); }
function renderModal(center){
  let el = document.getElementById('modalRoot');
  if(!el){ el = document.createElement('div'); el.id='modalRoot'; document.body.appendChild(el); }
  el.innerHTML = `<div class="modal-bg" data-act="closemodal">
    <div class="modal ${center?'center':''}" data-stop="1">${modalHTML}</div>
  </div>`;
  el.querySelector('.modal').addEventListener('click', e=>e.stopPropagation());
  el.querySelector('.modal-bg').addEventListener('click', ()=>closeModal());
  attachEvents(el);
}

// ---------- event wiring ----------
function attachEvents(scope){
  const root = scope || document;
  root.querySelectorAll('[data-act]').forEach(el=>{
    el.onclick = (e)=> handleAction(el.dataset, el);
  });
  const si = root.querySelector('#searchInput');
  if(si){ si.oninput = (e)=>{ state.searchQuery = e.target.value; render(); document.getElementById('searchInput').focus(); document.getElementById('searchInput').setSelectionRange(state.searchQuery.length,state.searchQuery.length); }; }
}

async function handleAction(d, el){
  switch(d.act){
    case 'togglepw': {
      const inp = document.getElementById(d.target);
      if(inp){ inp.type = inp.type === 'password' ? 'text' : 'password'; el.textContent = inp.type === 'password' ? '👁️' : '🙈'; }
      break;
    }
    case 'togglelang': state.lang = state.lang==='hi' ? 'en' : 'hi'; pSet('lang', state.lang); render(); break;
    case 'refreshnow': showToast('Refreshing...'); await refreshShared(); showToast('Updated'); break;
    case 'mode-shop': state.mode='shop'; render(); refreshShared(); break;
    case 'mode-admin': state.mode='admin'; render(); refreshShared(); break;
    case 'shoptab': state.shopTab=d.tab; render(); refreshShared(); break;
    case 'admintab': state.adminTab=d.tab; render(); refreshShared(); break;
    case 'setcat': state.activeCat=d.cat; render(); break;
    case 'catnav': state.activeCat=d.cat; state.shopTab='home'; render(); break;
    case 'addcart': await addToCart(d.id,1); showToast('Added to cart'); break;
    case 'buynow': await addToCart(d.id,1); state.shopTab='cart'; render(); break;
    case 'cartplus': await addToCart(d.id,1); break;
    case 'cartminus': await addToCart(d.id,-1); break;
    case 'cartremove': state.cart = state.cart.filter(i=>i.productId!==d.id); await pSet('cart', state.cart); render(); break;
    case 'viewproduct': openProductDetail(d.id); break;
    case 'checkout': if(!currentCustomer()){ state.shopTab='profile'; state.authMode='login'; render(); showToast('Please login or create an account to checkout'); } else openCheckout(); break;
    case 'saveprofile': await saveProfile(); break;
    case 'addaddress': addAddressPrompt(); break;
    case 'deladdress': { const cu=currentCustomer(); if(cu){ cu.addresses.splice(Number(d.i),1); await sSet('customers', state.customers); render(); } break; }
    case 'authmode': state.authMode = d.m; render(); break;
    case 'doregister': await doRegister(); break;
    case 'dologin': await doLogin(); break;
    case 'logout': await doLogout(); break;
    case 'closemodal': closeModal(); break;
    case 'reqcancel': openCancelRequest(d.id); break;
    case 'vieworder': openOrderDetail(d.id); break;
    case 'adminlogin': doAdminLogin(); break;
    case 'adminlogout': state.adminLoggedIn=false; pSet('adminSession', false); render(); break;
    case 'newproduct': openProductForm(null); break;
    case 'editproduct': openProductForm(d.id); break;
    case 'delproduct': if(confirm('Delete this product?')){ state.products = state.products.filter(p=>p.id!==d.id); await sSet('products', state.products); render(); } break;
    case 'toggleactive': { const p=productById(d.id); p.active=!p.active; await sSet('products', state.products); render(); break; }
    case 'togglefeatured': { const p=productById(d.id); p.featured=!p.featured; await sSet('products', state.products); render(); break; }
    case 'newcategory': openCategoryForm(null); break;
    case 'newoffer': openOfferForm(null); break;
    case 'editoffer': openOfferForm(d.id); break;
    case 'deloffer': if(confirm('Delete this offer?')){ state.offers = state.offers.filter(o=>o.id!==d.id); await sSet('offers', state.offers); render(); } break;
    case 'toggleofferactive': { const o=state.offers.find(o=>o.id===d.id); o.active=!o.active; await sSet('offers', state.offers); render(); break; }
    case 'newcashsale': openLedgerForm('sale'); break;
    case 'newpurchase': openLedgerForm('purchase'); break;
    case 'setledger': state.ledgerRange = d.r; render(); break;
    case 'viewmemo': openCashMemo(d.id); break;
    case 'delledger': if(confirm('Delete this entry?')){ state.ledger = state.ledger.filter(e=>e.id!==d.id); await sSet('ledger', state.ledger); render(); } break;
    case 'newdealer': openDealerForm(null); break;
    case 'editdealer': openDealerForm(d.id); break;
    case 'deldealer': if(confirm('Delete this dealer and all their transaction history?')){ state.dealers = state.dealers.filter(x=>x.id!==d.id); state.dealerTx = state.dealerTx.filter(x=>x.dealerId!==d.id); await sSet('dealers', state.dealers); await sSet('dealerTx', state.dealerTx); render(); } break;
    case 'viewdealer': openDealerDetail(d.id); break;
    case 'newdealertx': openDealerTxForm(d.id, d.type); break;
    case 'deldealertx': if(confirm('Delete this transaction?')){ state.dealerTx = state.dealerTx.filter(x=>x.id!==d.id); await sSet('dealerTx', state.dealerTx); openDealerDetail(d.dealer); } break;
    case 'newcust': openCustForm(null); break;
    case 'editcust': openCustForm(d.id); break;
    case 'delcust': if(confirm('Delete this customer and all their transaction history?')){ state.custLedgerAccounts = state.custLedgerAccounts.filter(x=>x.id!==d.id); state.custLedgerTx = state.custLedgerTx.filter(x=>x.custId!==d.id); await sSet('custLedgerAccounts', state.custLedgerAccounts); await sSet('custLedgerTx', state.custLedgerTx); render(); } break;
    case 'viewcust': openCustDetail(d.id); break;
    case 'newcusttx': openCustTxForm(d.id, d.type); break;
    case 'delcusttx': if(confirm('Delete this transaction?')){ state.custLedgerTx = state.custLedgerTx.filter(x=>x.id!==d.id); await sSet('custLedgerTx', state.custLedgerTx); openCustDetail(d.cust); } break;
    case 'downloadsummary': {
      const blob = new Blob([buildSummaryText()], {type:'text/plain'});
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'hisaab_summary.txt'; a.click();
      break;
    }
    case 'downloadbackup': {
      const backup = {};
      SHARED_KEYS.forEach(k=> backup[k] = state[k]);
      backup._backupDate = nowStr();
      const blob = new Blob([JSON.stringify(backup, null, 2)], {type:'application/json'});
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'shop_backup_'+new Date().toISOString().slice(0,10)+'.json'; a.click();
      break;
    }
    case 'delreview': if(confirm('Delete this review?')){ state.reviews = state.reviews.filter(r=>r.id!==d.id); await sSet('reviews', state.reviews); render(); } break;
    case 'delorder': if(confirm('Permanently delete this cancelled order? This cannot be undone.')){ state.orders = state.orders.filter(o=>o.id!==d.id); await sSet('orders', state.orders); render(); showToast('Order deleted'); } break;
    case 'editcat': openCategoryForm(d.id); break;
    case 'delcat': if(confirm('Delete this category? Products in it will move to Other.')) await deleteCategory(d.id); break;
    case 'catup': await moveCategory(d.id,-1); break;
    case 'catdown': await moveCategory(d.id,1); break;
    case 'advance': await advanceOrder(d.id); break;
    case 'admincancel': await adminCancelOrder(d.id); break;
    case 'approvecancel': await approveCancel(d.id); break;
    case 'rejectcancel': await rejectCancel(d.id); break;
    case 'genbill': openOrderDetail(d.id, true); break;
    case 'stockadjust': openStockAdjust(d.id, d.dir); break;
    case 'setreport': state.reportRange = d.r; render(); break;
    case 'exportreport': exportReportCsv(); break;
    case 'savesettings': await saveSettings(); break;
    case 'setlogo': state.settings.logo = d.e; await sSet('settings', state.settings); render(); break;
    case 'setfesticon': document.getElementById('s_festemoji').value = d.e; document.querySelectorAll('[data-act="setfesticon"]').forEach(x=>x.style=''); el.style='border-color:var(--leaf);background:#eef8f0;'; break;
    case 'savesiteurl': {
      state.settings.siteUrl = document.getElementById('s_siteurl').value.trim();
      await sSet('settings', state.settings);
      showToast('Link saved');
      render();
      break;
    }
    case 'copysiteurl': navigator.clipboard?.writeText(state.settings.siteUrl).then(()=>showToast('Link copied')); break;
    case 'savefestival': {
      state.settings.festivalText = document.getElementById('s_festtext').value.trim();
      state.settings.festivalEmoji = document.getElementById('s_festemoji').value;
      state.settings.festivalActive = document.getElementById('s_festactive').checked;
      await sSet('settings', state.settings);
      showToast('Festival banner saved');
      render();
      break;
    }
    case 'newcustominfo': openCustomInfoForm(); break;
    case 'delcustominfo': state.customInfo = state.customInfo.filter(c=>c.id!==d.id); await sSet('customInfo', state.customInfo); render(); break;
    case 'selectpay': {
      document.querySelectorAll('.pay-option').forEach(p=>p.classList.remove('selected'));
      el.classList.add('selected');
      const r = el.querySelector('input'); if(r) r.checked = true;
      state._payMethod = d.m;
      const box = document.getElementById('upiBox'); if(box) box.style.display = d.m==='UPI' ? 'block':'none';
      break;
    }
    case 'copyupi': navigator.clipboard?.writeText(state.settings.upi).then(()=>showToast('UPI ID copied')); break;
    case 'placeorder': await placeOrder(); break;
  }
}

async function addToCart(productId, delta){
  const p = productById(productId); if(!p) return;
  let item = state.cart.find(i=>i.productId===productId);
  if(!item){ if(delta<=0) return; item = {productId, qty:0}; state.cart.push(item); }
  item.qty = Math.max(0, Math.min(p.availableQty, item.qty+delta));
  state.cart = state.cart.filter(i=>i.qty>0);
  await pSet('cart', state.cart);
  render();
}

async function saveProfile(){
  const cu = currentCustomer(); if(!cu) return;
  cu.name = document.getElementById('pf_name').value.trim();
  cu.email = document.getElementById('pf_email').value.trim();
  await sSet('customers', state.customers);
  showToast('Profile saved');
}
function addAddressPrompt(){
  const cu = currentCustomer(); if(!cu) return;
  const a = prompt('Enter delivery address:');
  if(a){ cu.addresses = cu.addresses||[]; cu.addresses.push(a); sSet('customers', state.customers).then(render); }
}
async function doRegister(){
  const name = document.getElementById('au_name').value.trim();
  const mobile = document.getElementById('au_mobile').value.trim();
  const address = document.getElementById('au_address').value.trim();
  const email = document.getElementById('au_email').value.trim();
  const password = document.getElementById('au_password').value;
  if(!name || !mobile || !password){ alert('Name, mobile number and password are required.'); return; }
  if(state.customers.find(c=>c.mobile===mobile)){ alert('An account with this mobile number already exists. Please login instead.'); state.authMode='login'; render(); return; }
  const customer = {mobile, name, email, password, addresses: address ? [address] : []};
  state.customers.push(customer);
  await sSet('customers', state.customers);
  state.session = {mobile};
  await pSet('session', state.session);
  showToast('Account created');
  state.shopTab = 'home';
  render();
}
async function doLogin(){
  const mobile = document.getElementById('au_lmobile').value.trim();
  const password = document.getElementById('au_lpassword').value;
  const cu = state.customers.find(c=>c.mobile===mobile);
  if(!cu || cu.password !== password){ alert('Incorrect mobile number or password.'); return; }
  state.session = {mobile};
  await pSet('session', state.session);
  showToast('Logged in');
  state.shopTab = 'home';
  render();
}
async function doLogout(){
  state.session = null;
  await pSet('session', null);
  state.shopTab = 'profile';
  render();
}

  openModal(`

    <div class="summary-line"><span>${t('delivery')}</span><span>${money(dc)}</span></div>
    <div class="summary-line total"><span>${t('grandTotal')}</span><span>${money(grand)}</span></div>
    <button class="btn btn-leaf btn-block" style="margin-top:10px;padding:13px;" data-act="placeorder">${t('placeOrder')}</button>
  `, false);
  state._payMethod = "UPI";
  loadQRLib().then(()=>{
    const el = document.getElementById('qrcode');
    if(el && window.QRCode){ el.innerHTML=''; new QRCode(el, {text:`upi://pay?pa=${state.settings.upi}&pn=${encodeURIComponent(state.settings.shopName)}&am=${cartTotal()+state.settings.deliveryCharge}&cu=INR`, width:130, height:130}); }
  });
}
let _qrLibPromise = null;
function loadQRLib(){
  if(window.QRCode) return Promise.resolve();
  if(_qrLibPromise) return _qrLibPromise;
  _qrLibPromise = new Promise((resolve)=>{
    const s = document.createElement('script');
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js";
    s.onload = ()=> resolve();
    s.onerror = ()=> resolve(); // fail silently — checkout still works without the QR image
    document.head.appendChild(s);
    setTimeout(resolve, 3000); // don't block checkout forever if the network is slow/unavailable
  });
  return _qrLibPromise;
}



async function placeOrder(){
  const name = document.getElementById('co_name').value.trim();
  const mobile = document.getElementById('co_mobile').value.trim();
  const address = document.getElementById('co_address').value.trim();
  const notes = document.getElementById('co_notes').value.trim();
  if(!name || !mobile || !address){ alert('Please fill your name, mobile number and address.'); return; }
  if(cartTotal() < state.settings.minOrder){ alert('Minimum order amount is '+money(state.settings.minOrder)); return; }

  const cu = currentCustomer();
  if(cu){
    cu.name = name;
    cu.addresses = cu.addresses||[];
    if(!cu.addresses.includes(address)) cu.addresses.unshift(address);
    await sSet('customers', state.customers);
  }

  // Skip any stale cart entries whose product no longer exists (can happen after
  // a data reset/reseed) instead of crashing the checkout.
  const staleItems = state.cart.filter(i=>!productById(i.productId));
  if(staleItems.length){
    state.cart = state.cart.filter(i=>productById(i.productId));
    await pSet('cart', state.cart);
  }
  const items = state.cart.map(i=>{ const p=productById(i.productId); return {productId:p.id, name:p.name, qty:i.qty, price:p.sellingPrice, unit:p.unit}; });
  if(!items.length){ alert('Some items in your cart are no longer available. Please add products again.'); closeModal(); state.shopTab='cart'; render(); return; }
  const dc = state.settings.deliveryCharge;
  const grand = cartTotal()+dc;
  const order = {
    id: uid('ord_'), invoiceNo:null, customerName:name, mobile, address, items,
    subtotal: cartTotal(), deliveryCharge: dc, grandTotal: grand,
    paymentMethod: state._payMethod||'UPI', notes, status:'New', cancelRequested:false, cancelReason:null,
    createdAt: Date.now(), createdAtStr: nowStr()
  };
  state.orders.unshift(order);
  await sSet('orders', state.orders);

  // reduce stock
  for(const it of items){ await adjustStock(it.productId, -it.qty, 'Order '+order.id.slice(-5)+' placed'); }

  state.cart = []; await pSet('cart', []);
  closeModal();
  state.shopTab='orders'; render();
  showToast('Order placed successfully!');

  // Offer WhatsApp send as a direct tappable link (not auto-opened) — browsers/Android
  // block or mis-handle app-links triggered programmatically after a delay, so a real,
  // fresh tap on an actual link is the only reliable way to hand off to the WhatsApp app.
  const msg = `Shop Name: ${state.settings.shopName}\nCustomer Name: ${name}\nMobile Number: ${mobile}\nOrder Number: ${order.id.slice(-5)}\nProducts:\n${items.map((i,idx)=>`${idx+1}. ${i.name} x${i.qty}`).join('\n')}\nQuantity: ${items.reduce((s,i)=>s+i.qty,0)}\nTotal Amount: ${money(grand)}\nDelivery Address: ${address}\nPayment: ${order.paymentMethod}`;
  openWhatsAppPrompt(state.settings.whatsapp, msg);
}

    <button class="btn btn-outline btn-block" style="margin-top:10px;" data-act="closemodal">Skip</button>
  `, true);
}

function openProductDetail(id){
  const p = productById(id);
  if(!p) return;
  const rating = productRating(id);
  const reviews = productReviews(id);
  const cu = currentCustomer();
  const cat = catName(p.category);
  openModal(`
    <div class="modal-head"><h3>${escapeHtml(p.name)}</h3><button class="xbtn" data-act="closemodal">✕</button></div>
    <div style="text-align:center;margin-bottom:12px;">
      <div style="width:120px;height:120px;margin:0 auto;border-radius:14px;overflow:hidden;background:#eef1e9;display:flex;align-items:center;justify-content:center;font-size:50px;">${imgOrEmoji(p.images && p.images[0])}</div>
    </div>
    <div class="tiny">${escapeHtml(cat)} • ${escapeHtml(p.unit)}</div>
    <div class="price-row" style="margin:6px 0;"><span class="price" style="font-size:18px;">${money(p.sellingPrice)}</span>${p.mrp>p.sellingPrice?`<span class="mrp">${money(p.mrp)}</span>`:''}</div>
    ${p.freebie? `<div class="freebie-tag" style="margin-bottom:8px;">🎁 ${escapeHtml(p.freebie)}</div>` : ''}
    <div style="margin-bottom:10px;">${starsHTML(rating.avg,16)} <span class="tiny">${rating.count? `${rating.avg.toFixed(1)} (${rating.count})` : ''}</span></div>
    <div class="tiny" style="margin-bottom:14px;">${escapeHtml(p.description)}</div>
    <div style="display:flex;gap:8px;margin-bottom:16px;">
      ${p.availableQty>0? `
      <button class="btn btn-outline" style="flex:1" data-act="addcart" data-id="${p.id}">${t('add')}</button>
      <button class="btn btn-turm" style="flex:1" data-act="buynow" data-id="${p.id}">${t('buyNow')}</button>` : `<button class="btn btn-outline btn-block" disabled>${t('unavailable')}</button>`}
    </div>
    <div style="border-top:1px solid var(--line);padding-top:14px;">
      <div class="h2" style="font-size:15px;">${t('reviews')} ${rating.count?`(${rating.count})`:''}</div>
      ${reviews.length? reviews.map(r=>`
        <div style="padding:10px 0;border-bottom:1px solid var(--line);">
          <div style="display:flex;justify-content:space-between;">
            <b style="font-size:13px;">${escapeHtml(r.customerName)}</b>
            <span class="tiny">${r.dateStr}</span>
          </div>
          <div>${starsHTML(r.rating,12)}</div>
          ${r.comment? `<div class="tiny" style="margin-top:4px;">${escapeHtml(r.comment)}</div>`:''}
        </div>
      `).join('') : `<div class="tiny" style="padding:10px 0;">${t('noReviews')}</div>`}
      <div style="margin-top:14px;">
        ${cu? `
          <div class="h2" style="font-size:14px;">${t('addReview')}</div>
          <label class="field">${t('yourRating')}</label>
          <div style="font-size:26px;margin-bottom:10px;">
            ${[1,2,3,4,5].map(n=>`<span data-act="pickstar" data-n="${n}" style="cursor:pointer;color:#ddd8c8;">★</span>`).join('')}
          </div>
          <label class="field">${t('yourReview')}</label>
          <textarea class="input" id="rv_comment" placeholder="${t('yourReview')}"></textarea>
          <button class="btn btn-leaf btn-block" id="rvSubmit">${t('submitReview')}</button>
        ` : `<div class="tiny">${t('loginToReview')}</div>`}
      </div>
    </div>
  `, false);
  state._reviewRating = 0;
  if(cu){
    setTimeout(()=>{
      document.querySelectorAll('[data-act="pickstar"]').forEach(s=>{
        s.onclick = ()=>{
          state._reviewRating = Number(s.dataset.n);
          document.querySelectorAll('[data-act="pickstar"]').forEach(x=>{ x.style.color = Number(x.dataset.n) <= state._reviewRating ? '#e2a125' : '#ddd8c8'; });
        };
      });
      document.getElementById('rvSubmit').onclick = async ()=>{
        if(!state._reviewRating){ alert('Please pick a star rating.'); return; }
        const comment = document.getElementById('rv_comment').value.trim();
        const review = { id: uid('rv_'), productId: p.id, customerName: cu.name, mobile: cu.mobile, rating: state._reviewRating, comment, date_ts: Date.now(), dateStr: nowStr() };
        state.reviews.unshift(review);
        await sSet('reviews', state.reviews);
        showToast('Review submitted');
        openProductDetail(p.id);
      };
    },30);
  }
}

function openCancelRequest(orderId){
  openModal(`
    <div class="modal-head"><h3>Request Cancellation</h3><button class="xbtn" data-act="closemodal">✕</button></div>
    <label class="field">Reason for cancellation</label>
    <textarea class="input" id="cr_reason" placeholder="e.g. ordered by mistake"></textarea>
    <button class="btn btn-brick btn-block" id="crConfirm">Submit Request</button>
  `, true);
  setTimeout(()=>{
    document.getElementById('crConfirm').onclick = async ()=>{
      const reason = document.getElementById('cr_reason').value.trim();
      const o = state.orders.find(o=>o.id===orderId);
      o.cancelRequested = true; o.cancelReason = reason;
      await sSet('orders', state.orders);
      closeModal(); render();
      showToast('Cancellation requested');
    };
  },30);
}

function openOrderDetail(orderId, genInvoice){
  const o = state.orders.find(o=>o.id===orderId);
  if(genInvoice && !o.invoiceNo){ o.invoiceNo = String(state.invoiceCounter).padStart(4,'0'); state.invoiceCounter++; sSet('orders', state.orders); sSet('invoiceCounter', state.invoiceCounter); }
  const s = state.settings;
  const waText = `Invoice ${o.invoiceNo||o.id.slice(-5)} from ${s.shopName}\nCustomer: ${o.customerName}\nTotal: ${money(o.grandTotal)}\nStatus: ${o.status}`;

function openProductForm(id){

    <label class="field">Product Name</label><input class="input" id="pf_pname" value="${p?escapeHtml(p.name):''}">

    <label class="field">Product Photos</label>
    <div class="imgrow" id="pf_imgrow"></div>
    <label class="btn btn-outline btn-block" style="display:block;text-align:center;margin-bottom:6px;">

    </label>
    <div class="tiny" style="margin-bottom:10px;">Or tap an icon below if you don't have a photo yet:</div>

    <div style="display:flex;gap:10px;">
      <div style="flex:1;"><label class="field">Selling Price (₹)</label><input type="number" class="input" id="pf_sp" value="${p?p.sellingPrice:''}"></div>
      <div style="flex:1;"><label class="field">MRP (₹)</label><input type="number" class="input" id="pf_mrp" value="${p?p.mrp:''}"></div>
    </div>
    <div style="display:flex;gap:10px;">
      <div style="flex:1;"><label class="field">Unit</label><select class="input" id="pf_unit">${['kg','gram','litre','ml','piece','packet'].map(u=>`<option ${p&&p.unit===u?'selected':''}>${u}</option>`).join('')}</select></div>
      <div style="flex:1;"><label class="field">Available Qty</label><input type="number" class="input" id="pf_qty" value="${p?p.availableQty:'0'}"></div>
    </div>
    <label class="field">SKU / Product Code</label><input class="input" id="pf_sku" value="${p?escapeHtml(p.sku):'SKU'+Math.floor(1000+Math.random()*9000)}">
    <label class="field">Free Gift / Combo Offer (optional)</label><input class="input" id="pf_freebie" value="${p&&p.freebie?escapeHtml(p.freebie):''}" placeholder="e.g. Buy 1 Get 1 Free, Free soap included">
    <div class="chk"><input type="checkbox" id="pf_featured" ${p&&p.featured?'checked':''}> Featured product</div>
    <div class="chk"><input type="checkbox" id="pf_active" ${!p||p.active?'checked':''}> Active (visible to customers)</div>
    <button class="btn btn-leaf btn-block" id="pfSave">${p?'Save Changes':'Add Product'}</button>
  `, false);

  function renderImgRow(){
    const el = document.getElementById('pf_imgrow');
    if(!el) return;
    el.innerHTML = (formImages.length ? formImages.map((img,i)=>`
      <div class="imgpick">${imgOrEmoji(img)}<button class="rm" data-rmidx="${i}">✕</button></div>
    `).join('') : `<div class="tiny" style="padding:6px 0;">No photo yet — a default 🛒 icon will be used.</div>`);
    el.querySelectorAll('[data-rmidx]').forEach(b=>{
      b.onclick = ()=>{ formImages.splice(Number(b.dataset.rmidx),1); renderImgRow(); };
    });
  }
  renderImgRow();

  setTimeout(()=>{
    document.getElementById('pf_imgfile').onchange = async (e)=>{
      const files = Array.from(e.target.files||[]);
      for(const f of files){
        try{ const durl = await fileToResizedDataUrl(f); formImages.push(durl); }
        catch(err){ console.error(err); alert('Could not read that image.'); }
      }
      renderImgRow();
      e.target.value = '';
    };
    document.querySelectorAll('[data-act="picksymbol"]').forEach(b=>{
      b.onclick = ()=>{ formImages.push(b.dataset.e); renderImgRow(); };
    });
    document.getElementById('pfSave').onclick = async ()=>{
      const data = {
        name: document.getElementById('pf_pname').value.trim(),
        category: document.getElementById('pf_cat').value,
        images: formImages.length ? formImages : ['🛒'],
        description: document.getElementById('pf_desc').value.trim(),
        sellingPrice: Number(document.getElementById('pf_sp').value)||0,
        mrp: Number(document.getElementById('pf_mrp').value)||0,
        unit: document.getElementById('pf_unit').value,
        availableQty: Number(document.getElementById('pf_qty').value)||0,
        sku: document.getElementById('pf_sku').value.trim(),
        freebie: document.getElementById('pf_freebie').value.trim(),
        featured: document.getElementById('pf_featured').checked,
        active: document.getElementById('pf_active').checked,
      };
      if(!data.name){ alert('Product name is required.'); return; }
      if(p){ Object.assign(p, data); }
      else { state.products.push({id:uid('p_'), ...data}); }
      await sSet('products', state.products);
      closeModal(); render();
      showToast(p?'Product updated':'Product added');
    };
  },30);
}

        active: document.getElementById('of_active').checked,
      };
      if(o){ Object.assign(o, data); }
      else { state.offers.push({id:uid('off_'), ...data}); }
      await sSet('offers', state.offers);
      closeModal(); render();
      showToast(o?'Offer updated':'Offer added');
    };
  },30);
}

function openCategoryForm(id){
  const c = id ? state.categories.find(c=>c.id===id) : null;
  openModal(`
    <div class="modal-head"><h3>${c?'Edit':'Add'} Category</h3><button class="xbtn" data-act="closemodal">✕</button></div>
    <label class="field">Category Name</label><input class="input" id="cf_name" value="${c?escapeHtml(c.name):''}">
    <button class="btn btn-leaf btn-block" id="cfSave">${c?'Save':'Add Category'}</button>
  `, true);
  setTimeout(()=>{
    document.getElementById('cfSave').onclick = async ()=>{
      const name = document.getElementById('cf_name').value.trim();
      if(!name) return;
      if(c) c.name = name;
      else state.categories.push({id:uid('cat_'), name, order: state.categories.length});
      await sSet('categories', state.categories);
      closeModal(); render();
    };
  },30);
}
async function deleteCategory(id){
  const other = state.categories.find(c=>c.name==='Other') || state.categories[0];
  state.products.forEach(p=>{ if(p.category===id) p.category = other.id; });
  state.categories = state.categories.filter(c=>c.id!==id);
  await sSet('categories', state.categories);
  await sSet('products', state.products);
  render();
}
async function moveCategory(id, dir){
  const sorted = state.categories.sort((a,b)=>a.order-b.order);
  const idx = sorted.findIndex(c=>c.id===id);
  const swapIdx = idx+dir;
  if(swapIdx<0 || swapIdx>=sorted.length) return;
  const tmp = sorted[idx].order; sorted[idx].order = sorted[swapIdx].order; sorted[swapIdx].order = tmp;
  await sSet('categories', state.categories);
  render();
}

async function advanceOrder(id){
  const steps = ["New","Confirmed","Preparing","Out","Delivered"];
  const o = state.orders.find(o=>o.id===id);
  const idx = steps.indexOf(o.status);
  if(idx<steps.length-1){ o.status = steps[idx+1]; await sSet('orders', state.orders); render(); showToast('Order moved to '+o.status); }
}
async function adminCancelOrder(id){
  const reason = prompt('Reason for cancelling this order:') || 'Cancelled by admin';
  const o = state.orders.find(o=>o.id===id);
  o.status='Cancelled'; o.cancelReason=reason; o.cancelRequested=false;
  await sSet('orders', state.orders);
  for(const it of o.items){ await adjustStock(it.productId, it.qty, 'Order '+o.id.slice(-5)+' cancelled — stock restored'); }
  render();
}
async function approveCancel(id){
  const o = state.orders.find(o=>o.id===id);
  o.status='Cancelled'; o.cancelRequested=false;
  await sSet('orders', state.orders);
  for(const it of o.items){ await adjustStock(it.productId, it.qty, 'Order '+o.id.slice(-5)+' cancellation approved — stock restored'); }
  render();
}
async function rejectCancel(id){
  const o = state.orders.find(o=>o.id===id);
  o.cancelRequested=false;
  await sSet('orders', state.orders);
  render();
}

function openStockAdjust(id, dir){
  const p = productById(id);
  openModal(`
    <div class="modal-head"><h3>${dir==='add'?'Add':'Remove'} Stock — ${escapeHtml(p.name)}</h3><button class="xbtn" data-act="closemodal">✕</button></div>
    <div class="tiny" style="margin-bottom:10px;">Current stock: ${p.availableQty} ${p.unit}</div>
    <label class="field">Quantity</label><input type="number" class="input" id="sa_qty" min="1" value="1">
    <label class="field">Reason</label><input class="input" id="sa_reason" placeholder="${dir==='add'?'e.g. new stock arrived':'e.g. damaged / expired'}">
    <button class="btn btn-leaf btn-block" id="saConfirm">Confirm</button>
  `, true);
  setTimeout(()=>{
    document.getElementById('saConfirm').onclick = async ()=>{
      const qty = Number(document.getElementById('sa_qty').value)||0;
      const reason = document.getElementById('sa_reason').value.trim() || (dir==='add'?'Stock added':'Stock removed');
      if(qty<=0) return;
      await adjustStock(id, dir==='add'?qty:-qty, reason);
      closeModal(); render();
    };
  },30);
}

function exportReportCsv(){
  const rows = [["Order ID","Invoice","Customer","Mobile","Status","Payment","Total","Date"]];
  state.orders.forEach(o=> rows.push([o.id, o.invoiceNo||'', o.customerName, o.mobile, o.status, o.paymentMethod, o.grandTotal, o.createdAtStr]));
  const csv = rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'sales_report.csv'; a.click();
}

async function saveSettings(){
  const s = state.settings;
  s.shopName = document.getElementById('s_shopName').value.trim();
  s.address = document.getElementById('s_address').value.trim();
  s.phone = document.getElementById('s_phone').value.trim();
  s.whatsapp = document.getElementById('s_whatsapp').value.trim().replace(/\D/g,'');
  s.upi = document.getElementById('s_upi').value.trim();
  s.email = document.getElementById('s_email').value.trim();
  s.openTime = document.getElementById('s_open').value;
  s.closeTime = document.getElementById('s_close').value;
  s.deliveryCharge = Number(document.getElementById('s_delivery').value)||0;
  s.minOrder = Number(document.getElementById('s_minorder').value)||0;
  s.deliveryArea = document.getElementById('s_area').value.trim();
  s.about = document.getElementById('s_about').value.trim();
  s.terms = document.getElementById('s_terms').value.trim();
  s.privacy = document.getElementById('s_privacy').value.trim();
  s.adminPassword = document.getElementById('s_password').value.trim() || s.adminPassword;
  await sSet('settings', s);
  showToast('Settings saved');
  render();
}

function openCustomInfoForm(){
  openModal(`
    <div class="modal-head"><h3>Add Shop Information</h3><button class="xbtn" data-act="closemodal">✕</button></div>
    <label class="field">Title</label><input class="input" id="ci_title" placeholder="e.g. Diwali Offer">
    <label class="field">Details</label><textarea class="input" id="ci_content" placeholder="e.g. Flat 10% off on all cosmetics till 15th Oct"></textarea>
    <button class="btn btn-leaf btn-block" id="ciSave">Add</button>
  `, true);
  setTimeout(()=>{
    document.getElementById('ciSave').onclick = async ()=>{
      const title = document.getElementById('ci_title').value.trim();
      const content = document.getElementById('ci_content').value.trim();
      if(!title) return;
      state.customInfo.push({id:uid('ci_'), title, content});
      await sSet('customInfo', state.customInfo);
      closeModal(); render();
    };
  },30);
}

loadAll();
window.addEventListener('focus', ()=>{ if(sharedCache) refreshShared(); });
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible' && sharedCache) refreshShared(); });
</script>
